name: gogoke candidate resource signing

on:
  # Push only cancels an older candidate workflow. Signing and installation
  # require an explicit dispatch at a stable point.
  push:
    branches:
      - main
      - codex/gogoke-37-l0
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact desktop build commit; also the branch smoke workflow revision
        required: true
        type: string
      run_id:
        description: Desktop CI run on main; signing run on codex/gogoke-37-l0
        required: true
        type: number
      run_attempt:
        description: Source run attempt on main; signing attempt on the branch
        required: true
        type: number
      artifact_id:
        description: Frozen artifact ID on main; signed artifact ID on the branch
        required: true
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-gogoke-37-candidate
  cancel-in-progress: true

jobs:

  authorize-and-sign:
    name: Verify source run and sign candidate resource bytes
    if: >-
      github.repository == 'taiyun668/gogoke' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: windows-latest
    environment: candidate-resource-signing
    steps:
      - name: Checkout trusted default-branch verifier only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove this workflow and verifier are running from main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Candidate signing workflow is not running from the trusted default branch.'
          }
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -cne $env:GITHUB_SHA) {
            throw 'Trusted verifier checkout is not the exact main workflow revision.'
          }
      - name: Resolve exact controlled source run and artifact identity
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $sourceCommit = [string]$event.inputs.source_commit
          $runId = [long]$event.inputs.run_id
          $runAttempt = [int]$event.inputs.run_attempt
          $artifactId = [long]$event.inputs.artifact_id
          if ($sourceCommit -cnotmatch '^[0-9a-f]{40}$' -or $runId -le 0 -or $artifactId -le 0) {
            throw 'Candidate signing identity is malformed.'
          }
          # Candidate PLAN.json is data; only main's verifier executes.
          $receiptBlob = '040be1d40ee317bd6c5960cbf83df7989dfc00b5'
          $receiptPath = 'artifacts/gogoke-37/intake/PUBLIC_AUTHORIZATION_RECEIPT.json'
          $planPath = 'docs/design/gogoke-37-plan-v1/PLAN.json'
          $verifierPath = './docs/design/gogoke-37-plan-v1/verify_plan.py'
          if ((git rev-parse "HEAD:$receiptPath").Trim() -cne $receiptBlob) {
            throw 'Trusted main public authorization receipt blob changed.'
          }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.schema -cne 'gogoke.37.public-authorization.v2' -or
              $receipt.repository -cne 'taiyun668/gogoke' -or
              $receipt.plan.scope_digest -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Trusted main public authorization receipt is malformed.'
          }
          $mainDigest = & python $verifierPath --scope-digest $planPath
          if ($LASTEXITCODE -ne 0 -or @($mainDigest).Count -ne 1 -or $mainDigest -cne $receipt.plan.scope_digest) {
            throw 'Trusted main plan scope differs from the Owner authorization.'
          }
          $currentMain = gh api 'repos/taiyun668/gogoke/commits/main' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $currentMain.sha -cne $env:GITHUB_SHA) {
            throw 'Trusted signing workflow checkout is not current main.'
          }
          $introducing = $null
          foreach ($commit in @(git log --first-parent --format=%H HEAD -- $receiptPath)) {
            if ((git rev-parse "${commit}:$receiptPath" 2>$null).Trim() -ceq $receiptBlob) {
              $introducing = $commit
              break
            }
          }
          if ($introducing -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Receipt introduction is absent from main first-parent history.'
          }
          $parents = @((git rev-list --parents -n 1 $introducing).Trim() -split ' ')
          if ($parents.Count -ne 3 -or $parents[0] -cne $introducing -or
              (git rev-parse "$($parents[1]):$receiptPath" 2>$null).Trim() -ceq $receiptBlob) {
            throw 'Receipt was not introduced by a main merge commit.'
          }
          $mergedPulls = @(gh api "repos/taiyun668/gogoke/commits/$introducing/pulls" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $mergedPulls.Count -ne 1 -or
              $mergedPulls[0].merge_commit_sha -cne $introducing -or $mergedPulls[0].number -le 0) {
            throw 'Receipt merge has no unique associated pull request.'
          }
          $mergedPull = gh api "repos/taiyun668/gogoke/pulls/$($mergedPulls[0].number)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $mergedPull.merged -or
              $mergedPull.base.ref -cne 'main' -or $mergedPull.base.repo.full_name -cne 'taiyun668/gogoke' -or
              $mergedPull.merge_commit_sha -cne $introducing -or
              $mergedPull.merged_by.login -cne 'taiyun668' -or -not $mergedPull.merged_at) {
            throw 'Receipt merge is not the Owner-merged main pull request.'
          }
          $comparison = gh api "repos/taiyun668/gogoke/compare/$introducing...$sourceCommit" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $comparison.status -cnotin @('ahead', 'identical') -or
              $comparison.merge_base_commit.sha -cne $introducing) {
            throw 'Candidate source is not descended from the receipt-introducing main merge.'
          }
          $sourceReceipt = gh api "repos/taiyun668/gogoke/contents/$receiptPath`?ref=$sourceCommit" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $sourceReceipt.type -cne 'file' -or
              $sourceReceipt.sha -cne $receiptBlob) {
            throw 'Candidate source does not contain the same public authorization receipt.'
          }
          $sourcePlan = gh api "repos/taiyun668/gogoke/contents/$planPath`?ref=$sourceCommit" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $sourcePlan.type -cne 'file' -or
              $sourcePlan.encoding -cne 'base64' -or $sourcePlan.size -le 0 -or
              $sourcePlan.size -gt 1048576) {
            throw 'Candidate plan data is unavailable or unbounded.'
          }
          $planData = Join-Path $env:RUNNER_TEMP "gogoke-candidate-plan-$sourceCommit.json"
          if (Test-Path -LiteralPath $planData) { throw 'Candidate plan temporary path already exists.' }
          try {
            [IO.File]::WriteAllBytes($planData, [Convert]::FromBase64String($sourcePlan.content))
            $sourceDigest = & python $verifierPath --scope-digest $planData
            if ($LASTEXITCODE -ne 0 -or @($sourceDigest).Count -ne 1 -or
                $sourceDigest -cne $receipt.plan.scope_digest) {
              throw 'Candidate plan scope differs from the Owner authorization.'
            }
          } finally { Remove-Item -LiteralPath $planData -Force -ErrorAction SilentlyContinue }
          $run = gh api "repos/taiyun668/gogoke/actions/runs/$runId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.repository.full_name -cne 'taiyun668/gogoke' -or
              $run.head_repository.full_name -cne 'taiyun668/gogoke' -or
              $run.head_branch -cne 'codex/gogoke-37-l0' -or
              $run.head_sha -cne $sourceCommit -or $run.run_attempt -ne $runAttempt -or
              $run.event -cne 'workflow_dispatch' -or
              $run.conclusion -cne 'success' -or $run.name -cne 'gogoke desktop CI' -or
              $run.path -cne '.github/workflows/gogoke-desktop.yml' -or $runAttempt -le 0) {
            throw 'Candidate source run is not the exact successful controlled build.'
          }
          $jobs = gh api "repos/taiyun668/gogoke/actions/runs/$runId/jobs?filter=latest&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $jobs.total_count -gt 100) {
            throw 'Candidate source build job inventory is unavailable or unbounded.'
          }
          foreach ($requiredName in @(
            'Browser build and tests',
            'Generate locked dependency notices',
            'Clean Windows build (frozen)',
            'Clean Windows build (repro)',
            'Compare independent Windows executable bytes'
          )) {
            $jobMatches = @($jobs.jobs | Where-Object {
              $_.name -ceq $requiredName -and $_.status -ceq 'completed' -and
              $_.conclusion -ceq 'success' -and $_.run_attempt -eq $runAttempt
            })
            if ($jobMatches.Count -ne 1) {
              throw "Required successful source build job is missing or ambiguous: $requiredName"
            }
          }
          $expectedName = "gogoke-windows-frozen-$sourceCommit-$runId"
          $inventory = gh api "repos/taiyun668/gogoke/actions/runs/$runId/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $inventory.total_count -gt 100) {
            throw 'Candidate source artifact inventory is unavailable or unbounded.'
          }
          $matches = @($inventory.artifacts | Where-Object {
            $_.id -eq $artifactId -and $_.name -ceq $expectedName -and -not $_.expired -and
            $_.size_in_bytes -gt 0 -and $_.size_in_bytes -le 1073741824
          })
          if ($matches.Count -ne 1) { throw 'Candidate frozen artifact identity or size is invalid.' }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "run_attempt=$runAttempt" >> $env:GITHUB_OUTPUT
          "artifact_id=$artifactId" >> $env:GITHUB_OUTPUT
          "artifact_name=gogoke-windows-frozen-$sourceCommit-$runId" >> $env:GITHUB_OUTPUT
      - name: Download exact frozen archive by ID and require uploaded digest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.identity.outputs.artifact_id }}
          SOURCE_RUN_ID: ${{ steps.identity.outputs.run_id }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact_name }}
        run: |
          $artifactId = [long]$env:ARTIFACT_ID
          $runId = [long]$env:SOURCE_RUN_ID
          $artifact = gh api "repos/taiyun668/gogoke/actions/artifacts/$artifactId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.id -ne $artifactId -or
              $artifact.name -cne $env:ARTIFACT_NAME -or $artifact.workflow_run.id -ne $runId -or
              $artifact.workflow_run.head_sha -cne $env:SOURCE_COMMIT -or $artifact.expired -or
              $artifact.size_in_bytes -le 0 -or $artifact.size_in_bytes -gt 1073741824 -or
              $artifact.digest -cnotmatch '^sha256:([0-9a-f]{64})$') {
            throw 'Exact frozen archive metadata or uploaded SHA-256 is invalid.'
          }
          $expectedDigest = [string]$artifact.digest.Substring(7)
          $archive = Join-Path $env:RUNNER_TEMP "gogoke-frozen-$artifactId.zip"
          if (Test-Path -LiteralPath $archive) { throw 'Frozen archive temporary path already exists.' }
          $endpoint = "https://api.github.com/repos/taiyun668/gogoke/actions/artifacts/$artifactId/zip"
          Invoke-WebRequest -Uri $endpoint -Headers @{Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'} `
            -MaximumRedirection 5 -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $artifact.size_in_bytes -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedDigest) {
            throw 'Downloaded frozen archive does not match the uploaded artifact digest.'
          }
          if (Test-Path -LiteralPath candidate-input) { throw 'Candidate input directory already exists.' }
          New-Item -ItemType Directory -Path candidate-input | Out-Null
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $fixedNames = @(
              'frozen-build.json', 'gogoke-package-hashes.json', 'gogoke-portable.exe',
              'gogoke-installed-shell.nsis.exe', 'gogoke-native-host.exe', 'node.exe',
              'gogoke-resources.windows.zip', 'resource-index.json'
            )
            $total = 0L
            foreach ($entry in $zip.Entries) {
              if (($fixedNames -cnotcontains $entry.FullName -and
                   $entry.FullName -cnotmatch '^gogoke-[0-9A-Za-z.+-]+-windows-x64-unsigned-setup\.exe$') -or
                  -not $seen.Add($entry.FullName) -or $entry.Length -lt 0 -or $entry.Length -gt 1073741824) {
                throw 'Frozen archive contains an unsafe or duplicate entry name.'
              }
              $total += $entry.Length
              if ($seen.Count -gt 20 -or $total -gt 1073741824) {
                throw 'Frozen archive exceeds the bounded extracted file set.'
              }
              $source = $entry.Open()
              try {
                $target = [IO.File]::Open((Join-Path 'candidate-input' $entry.FullName), [IO.FileMode]::CreateNew)
                try {
                  $copied = 0L
                  $buffer = [byte[]]::new(65536)
                  while (($read = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {
                    $copied += $read
                    if ($copied -gt $entry.Length) { throw 'Frozen archive entry exceeded its declared length.' }
                    $target.Write($buffer, 0, $read)
                  }
                  if ($copied -ne $entry.Length) { throw 'Frozen archive entry ended before its declared length.' }
                } finally { $target.Dispose() }
              } finally { $source.Dispose() }
            }
            if ($seen.Count -ne 9) { throw 'Frozen archive has an incomplete file set.' }
          } finally { $zip.Dispose() }
      - name: Verify complete frozen artifact byte inventory with trusted main code
        shell: pwsh
        run: |
          python ./tools/ci/gogoke_ci_frozen_artifact.py verify `
            --directory candidate-input `
            --source-commit '${{ steps.identity.outputs.source_commit }}' `
            --run-id '${{ steps.identity.outputs.run_id }}' `
            --run-attempt '${{ steps.identity.outputs.run_attempt }}' `
            --lane frozen
          if ($LASTEXITCODE -ne 0) { throw "Frozen candidate byte inventory verification failed: $LASTEXITCODE" }
      - name: Sign only the verified pack and index
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOGOKE_CANDIDATE_P256_KEY: ${{ secrets.GOGOKE_CANDIDATE_P256_KEY }}
        run: |
          & ./tools/ci/gogoke-candidate-sign.ps1 `
            -ArtifactDirectory candidate-input `
            -SourceCommit '${{ steps.identity.outputs.source_commit }}' `
            -RunId '${{ steps.identity.outputs.run_id }}' `
            -RunAttempt '${{ steps.identity.outputs.run_attempt }}' `
            -ArtifactId '${{ steps.identity.outputs.artifact_id }}'
          if ($LASTEXITCODE -ne 0) { throw "Candidate resource signing failed: $LASTEXITCODE" }
      - name: Remove unsigned duplicate metadata not consumed by the product
        shell: pwsh
        run: |
          foreach ($name in @('frozen-build.json', 'gogoke-installed-shell.nsis.exe')) {
            Remove-Item -LiteralPath (Join-Path 'candidate-input' $name) -Force
          }
      - name: Upload signed candidate set without executing source bytes
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-windows-candidate-${{ steps.identity.outputs.source_commit }}-${{ steps.identity.outputs.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input/*
          if-no-files-found: error
          retention-days: 30

  candidate-installed-smoke:
    name: Verify and install signed candidate on an isolated Windows runner
    if: github.repository == 'taiyun668/gogoke' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/gogoke-37-l0'
    timeout-minutes: 60
    runs-on: windows-latest
    env:
      SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
    steps:
      - name: Checkout the exact execution branch workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove the smoke code is the exact execution branch revision
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'taiyun668/gogoke' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/codex/gogoke-37-l0' -or
              $env:GITHUB_SHA -cne $env:SOURCE_COMMIT_INPUT -or
              (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {
            throw 'Installed smoke did not load its exact execution branch revision.'
          }
      - name: Checkout current trusted main verifier code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: trusted-main
          persist-credentials: false
      - name: Verify and download the exact signed candidate without executing it
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & ./trusted-main/tools/ci/gogoke-candidate-installed-preflight.ps1 `
            -ExpectedSourceCommit $env:SOURCE_COMMIT_INPUT `
            -SigningRunId '${{ inputs.run_id }}' `
            -SigningRunAttempt '${{ inputs.run_attempt }}' `
            -SignedArtifactId '${{ inputs.artifact_id }}'
          if ($LASTEXITCODE -ne 0) { throw "Signed candidate preflight failed: $LASTEXITCODE" }
      - name: Download separate CI-only negative installer from the exact source run
        uses: actions/download-artifact@v4
        with:
          name: gogoke-nsis-negative-${{ inputs.source_commit }}-${{ steps.preflight.outputs.source_run_id }}
          run-id: ${{ steps.preflight.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/gogoke-r206a-negative-installer-input
      - name: Exercise actual installed candidate product and uninstall
        shell: pwsh
        env:
          CANDIDATE_INPUT: ${{ steps.preflight.outputs.artifact_directory }}
          NEGATIVE_INSTALLER_INPUT: ${{ runner.temp }}/gogoke-r206a-negative-installer-input
        run: |
          # The hosted runner starts elevated; WebView2 product smoke uses a
          # pinned launcher to run the actual product under a Medium token.
          $toolRoot = Join-Path $env:RUNNER_TEMP "gogoke-candidate-medium-${{ github.run_id }}-${{ github.run_attempt }}"
          $runnerRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if (-not [IO.Path]::GetFullPath($toolRoot).StartsWith($runnerRoot + '\', [StringComparison]::OrdinalIgnoreCase) -or
              (Test-Path -LiteralPath $toolRoot)) {
            throw 'Medium token launcher path is not a fresh runner temporary child.'
          }
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          try {
            $archive = Join-Path $toolRoot 'gsudo.portable.zip'
            Invoke-WebRequest -Uri 'https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip' -OutFile $archive
            $expected = '21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw 'Pinned Medium token launcher archive digest mismatch.'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
            $launcher = Join-Path $toolRoot 'x64/gsudo.exe'
            if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
              throw 'Pinned Medium token launcher is missing.'
            }
            $smokeScript = (Resolve-Path -LiteralPath './tools/ci/gogoke-r2-06-candidate-installed-smoke.ps1').Path
            $arguments = @(
              '--integrity', 'Medium', '--direct', (Join-Path $PSHOME 'pwsh.exe'),
              '-NoProfile', '-File', $smokeScript,
              '-ArtifactDirectory', $env:CANDIDATE_INPUT,
              '-ExpectedSetupSha256', '${{ steps.preflight.outputs.setup_sha256 }}',
              '-ExpectedInstalledShellSha256', '${{ steps.preflight.outputs.installed_shell_sha256 }}',
              '-ExpectedNativeHostSha256', '${{ steps.preflight.outputs.native_host_sha256 }}',
              '-ExpectedNodeSha256', '${{ steps.preflight.outputs.node_sha256 }}',
              '-ExpectedVersion', '${{ steps.preflight.outputs.version }}',
              '-ExpectedSourceCommit', $env:SOURCE_COMMIT_INPUT,
              '-ExpectedRunId', '${{ steps.preflight.outputs.source_run_id }}',
              '-ExpectedRunAttempt', '${{ steps.preflight.outputs.source_run_attempt }}',
              '-ExpectedArtifactId', '${{ steps.preflight.outputs.source_artifact_id }}',
              '-ExpectedSigningRunId', '${{ steps.preflight.outputs.signing_run_id }}',
              '-ExpectedSigningRunAttempt', '${{ steps.preflight.outputs.signing_run_attempt }}',
              '-ExpectedSmokeRunId', '${{ github.run_id }}',
              '-ExpectedSmokeRunAttempt', '${{ github.run_attempt }}'
            )
            & $launcher @arguments
            if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) {
              throw "Installed candidate Medium smoke failed: $LASTEXITCODE"
            }
            $negativeScript = (Resolve-Path -LiteralPath './tools/ci/gogoke-r206a-installer-negative.ps1').Path
            $negativeArguments = @(
              '--integrity', 'Medium', '--direct', (Join-Path $PSHOME 'pwsh.exe'),
              '-NoProfile', '-File', $negativeScript,
              '-SignedArtifactDirectory', $env:CANDIDATE_INPUT,
              '-InstrumentArtifactDirectory', $env:NEGATIVE_INSTALLER_INPUT,
              '-ExpectedProductionSetupSha256', '${{ steps.preflight.outputs.setup_sha256 }}',
              '-ExpectedInstalledShellSha256', '${{ steps.preflight.outputs.installed_shell_sha256 }}',
              '-ExpectedSourceArtifactId', '${{ steps.preflight.outputs.source_artifact_id }}',
              '-ExpectedVersion', '${{ steps.preflight.outputs.version }}',
              '-ExpectedSourceCommit', $env:SOURCE_COMMIT_INPUT,
              '-ExpectedRunId', '${{ steps.preflight.outputs.source_run_id }}',
              '-ExpectedRunAttempt', '${{ steps.preflight.outputs.source_run_attempt }}',
              '-ExpectedSmokeRunId', '${{ github.run_id }}',
              '-ExpectedSmokeRunAttempt', '${{ github.run_attempt }}'
            )
            & $launcher @negativeArguments
            if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) {
              throw "CI-only negative installation axes failed: $LASTEXITCODE"
            }
          } finally {
            if (Test-Path -LiteralPath $toolRoot) {
              $toolItem = Get-Item -LiteralPath $toolRoot -Force
              if (($toolItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  -not [IO.Path]::GetFullPath($toolItem.FullName).StartsWith($runnerRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Medium token launcher cleanup target changed; runner teardown owns it.'
              }
              Remove-Item -LiteralPath $toolRoot -Recurse -Force
            }
          }
      - name: Upload bounded candidate installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-candidate-installed-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gogoke-r2-06-candidate-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload bounded CI-only installer negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-r206a-installer-negative-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gogoke-r206a-installer-negative-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 30
