name: gogoke candidate resource signing

on:
  workflow_run:
    workflows: ["gogoke desktop CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact successful controlled build commit
        required: true
        type: string
      run_id:
        description: Successful gogoke desktop CI run ID
        required: true
        type: number
      run_attempt:
        description: Exact source run attempt
        required: true
        type: number
      artifact_id:
        description: Exact frozen Windows artifact ID
        required: true
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || 'manual-main' }}
  cancel-in-progress: true

jobs:
  authorize-and-sign:
    name: Verify source run and sign candidate resource bytes
    if: >-
      github.repository == 'taiyun668/gogoke' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'taiyun668/gogoke' &&
        github.event.workflow_run.head_branch == 'gpt/s1-r4-r2-execution-r1'))
    timeout-minutes: 20
    runs-on: windows-latest
    environment: candidate-resource-signing
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      source_run_id: ${{ steps.identity.outputs.run_id }}
      signed_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted default-branch verifier only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prove this workflow and verifier are running from main
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main') {
            throw 'Candidate signing workflow is not running from the trusted default branch.'
          }
          $checkedOut = (git rev-parse HEAD).Trim()
          $remoteMain = (git ls-remote origin refs/heads/main).Split("`t")[0]
          if ($checkedOut -cne $remoteMain -or $checkedOut -cne '${{ github.sha }}') {
            throw 'Trusted verifier checkout is not the exact current main workflow revision.'
          }
      - name: Resolve exact controlled source run and artifact identity
        id: identity
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -ceq 'workflow_run') {
            $sourceCommit = '${{ github.event.workflow_run.head_sha }}'
            $runId = [long]'${{ github.event.workflow_run.id }}'
            $runAttempt = 0
            if ($sourceCommit -cnotmatch '^[0-9a-f]{40}$' -or $runId -le 0) {
              throw 'workflow_run source identity is malformed.'
            }
            $expectedName = "gogoke-windows-frozen-$sourceCommit-$runId"
            $inventory = gh api "repos/taiyun668/gogoke/actions/runs/$runId/artifacts?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Source artifact inventory is unavailable.' }
            $matches = @($inventory.artifacts | Where-Object {
              $_.name -ceq $expectedName -and -not $_.expired -and $_.size_in_bytes -gt 0
            })
            if ($matches.Count -ne 1) { throw 'Frozen source artifact identity is ambiguous or unavailable.' }
            $artifactId = [long]$matches[0].id
          } else {
            $sourceCommit = '${{ inputs.source_commit }}'
            $runId = [long]'${{ inputs.run_id }}'
            $runAttempt = [int]'${{ inputs.run_attempt }}'
            $artifactId = [long]'${{ inputs.artifact_id }}'
          }
          if ($sourceCommit -cnotmatch '^[0-9a-f]{40}$' -or $runId -le 0 -or $artifactId -le 0) {
            throw 'Candidate signing identity is malformed.'
          }
          $run = gh api "repos/taiyun668/gogoke/actions/runs/$runId" | ConvertFrom-Json
          if ('${{ github.event_name }}' -ceq 'workflow_run') {
            $runAttempt = [int]$run.run_attempt
          }
          if ($LASTEXITCODE -ne 0 -or $run.repository.full_name -cne 'taiyun668/gogoke' -or
              $run.head_repository.full_name -cne 'taiyun668/gogoke' -or
              $run.head_branch -cne 'gpt/s1-r4-r2-execution-r1' -or
              $run.head_sha -cne $sourceCommit -or $run.run_attempt -ne $runAttempt -or
              $run.conclusion -cne 'success' -or $run.name -cne 'gogoke desktop CI' -or
              $run.path -cne '.github/workflows/gogoke-desktop.yml' -or $runAttempt -le 0) {
            throw 'Candidate source run is not the exact successful controlled build.'
          }
          $jobs = gh api "repos/taiyun668/gogoke/actions/runs/$runId/jobs?filter=latest&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source build job inventory is unavailable.' }
          foreach ($requiredName in @(
            'Browser build and tests',
            'Generate locked dependency notices',
            'Clean Windows build (frozen)',
            'Clean Windows build (repro)',
            'Compare independent Windows executable bytes'
          )) {
            $jobMatches = @($jobs.jobs | Where-Object {
              $_.name -ceq $requiredName -and $_.status -ceq 'completed' -and
              $_.conclusion -ceq 'success' -and $_.run_attempt -eq $runAttempt
            })
            if ($jobMatches.Count -ne 1) {
              throw "Required successful source build job is missing or ambiguous: $requiredName"
            }
          }
          $expectedName = "gogoke-windows-frozen-$sourceCommit-$runId"
          $inventory = gh api "repos/taiyun668/gogoke/actions/runs/$runId/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source artifact inventory is unavailable.' }
          $matches = @($inventory.artifacts | Where-Object {
            $_.id -eq $artifactId -and $_.name -ceq $expectedName -and -not $_.expired -and
            $_.size_in_bytes -gt 0 -and $_.size_in_bytes -le 1073741824
          })
          if ($matches.Count -ne 1) { throw 'Candidate frozen artifact identity or size is invalid.' }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "run_attempt=$runAttempt" >> $env:GITHUB_OUTPUT
          "artifact_id=$artifactId" >> $env:GITHUB_OUTPUT
          "artifact_name=gogoke-windows-frozen-$sourceCommit-$runId" >> $env:GITHUB_OUTPUT
      - name: Download exact frozen artifact as untrusted data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path candidate-input | Out-Null
          gh run download '${{ steps.identity.outputs.run_id }}' --repo taiyun668/gogoke `
            --name '${{ steps.identity.outputs.artifact_name }}' --dir candidate-input
          if ($LASTEXITCODE -ne 0) { throw 'Exact frozen candidate artifact download failed.' }
      - name: Verify complete frozen artifact byte inventory with trusted main code
        shell: pwsh
        run: |
          python ./tools/ci/gogoke_ci_frozen_artifact.py verify `
            --directory candidate-input `
            --source-commit '${{ steps.identity.outputs.source_commit }}' `
            --run-id '${{ steps.identity.outputs.run_id }}' `
            --run-attempt '${{ steps.identity.outputs.run_attempt }}' `
            --lane frozen
          if ($LASTEXITCODE -ne 0) { throw "Frozen candidate byte inventory verification failed: $LASTEXITCODE" }
      - name: Sign only the verified pack and index
        shell: pwsh
        env:
          GOGOKE_CANDIDATE_P256_KEY: ${{ secrets.GOGOKE_CANDIDATE_P256_KEY }}
        run: |
          & ./tools/ci/gogoke-candidate-sign.ps1 `
            -ArtifactDirectory candidate-input `
            -SourceCommit '${{ steps.identity.outputs.source_commit }}' `
            -RunId '${{ steps.identity.outputs.run_id }}' `
            -RunAttempt '${{ steps.identity.outputs.run_attempt }}' `
            -ArtifactId '${{ steps.identity.outputs.artifact_id }}'
          if ($LASTEXITCODE -ne 0) { throw "Candidate resource signing failed: $LASTEXITCODE" }
      - name: Remove unsigned duplicate metadata not consumed by the product
        shell: pwsh
        run: |
          foreach ($name in @('frozen-build.json', 'gogoke-installed-shell.nsis.exe')) {
            Remove-Item -LiteralPath (Join-Path 'candidate-input' $name) -Force
          }
      - name: Upload signed candidate set without executing source bytes
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-windows-candidate-${{ steps.identity.outputs.source_commit }}-${{ steps.identity.outputs.run_id }}
          path: candidate-input/*
          if-no-files-found: error
          retention-days: 30
