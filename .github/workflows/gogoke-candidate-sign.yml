name: gogoke formal signed byte smoke

# Temporary execution-branch workflow at an existing dispatch path. Restore the
# candidate-smoke workflow after this exact signed-byte run completes.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact frozen full source commit
        required: true
        type: string
      run_id:
        description: Exact frozen full desktop CI run ID
        required: true
        type: number
      run_attempt:
        description: Exact frozen full desktop CI run attempt
        required: true
        type: number
      artifact_id:
        description: Exact frozen full artifact ID
        required: true
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-signed-byte-smoke:
    name: Verify Owner signatures and install exact frozen formal bytes
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout exact execution-branch smoke code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact execution-branch code
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'taiyun668/gogoke' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/gpt/s1-r4-r2-execution-r1' -or
              (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {
            throw 'Formal signed byte smoke did not load the exact execution branch.'
          }
      - name: Download frozen bytes and verify both Owner-signed manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOGOKE_R206B_FORMAL_SIGNATURES: ${{ secrets.GOGOKE_R206B_FORMAL_SIGNATURES_TEST_ONLY }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "gogoke-r206b-formal-${{ github.run_id }}"
          & ./tools/ci/gogoke-r206b-formal-signed-smoke-015-016.ps1 `
            -Mode Preflight -WorkRoot $root `
            -SourceCommit '${{ inputs.source_commit }}' `
            -SourceRunId '${{ inputs.run_id }}' `
            -SourceRunAttempt '${{ inputs.run_attempt }}' `
            -SourceArtifactId '${{ inputs.artifact_id }}'
          if ($LASTEXITCODE -ne 0) { throw "Formal preflight failed: $LASTEXITCODE" }
      - name: Exercise exact formal installed product and uninstall under Medium token
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "gogoke-r206b-formal-${{ github.run_id }}"
          $toolRoot = Join-Path $env:RUNNER_TEMP "gogoke-formal-medium-${{ github.run_id }}"
          if (Test-Path -LiteralPath $toolRoot) { throw 'Medium token tool root exists.' }
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          $archive = Join-Path $toolRoot 'gsudo.portable.zip'
          Invoke-WebRequest -Uri 'https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44') {
            throw 'Pinned Medium token launcher digest differs.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $launcher = Join-Path $toolRoot 'x64/gsudo.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'Pinned Medium launcher missing.' }
          $script = (Resolve-Path -LiteralPath './tools/ci/gogoke-r206b-formal-signed-smoke-015-016.ps1').Path
          & $launcher --integrity Medium --direct (Join-Path $PSHOME 'pwsh.exe') `
            -NoProfile -File $script -Mode Exercise -WorkRoot $root
          if ($LASTEXITCODE -ne 0) { throw "Formal installed smoke failed: $LASTEXITCODE" }
      - name: Upload bounded formal smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-formal-signed-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gogoke-r206b-formal-${{ github.run_id }}/formal-smoke-result.json
          if-no-files-found: ignore
          retention-days: 14
