name: gogoke desktop CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "tools/sign-gogoke-release-manifest.ps1"
      - "tools/publish-gogoke-release.ps1"
      - "tools/smoke-gogoke-update.ps1"
      - "tools/gogoke-release/**"
      - "tools/ci/**"
      - "third_party/t3code/**"
      - ".github/workflows/gogoke-desktop.yml"
      - ".github/workflows/gogoke-candidate-sign.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "tools/sign-gogoke-release-manifest.ps1"
      - "tools/publish-gogoke-release.ps1"
      - "tools/smoke-gogoke-update.ps1"
      - "tools/gogoke-release/**"
      - "tools/ci/**"
      - "third_party/t3code/**"
      - ".github/workflows/gogoke-desktop.yml"
      - ".github/workflows/gogoke-candidate-sign.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Browser build and tests
    timeout-minutes: 30
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check:product-identity
      - name: Check release trust boundary
        shell: pwsh
        run: |
          $public = (Get-Content src-tauri/gogoke-release-public-key.txt -Raw).Trim()
          if ($public -notmatch '^[0-9A-Fa-f]{128}$') {
            throw "gogoke release public key must be P-256 X||Y"
          }
          $trackedPrivate = @(git ls-files | Where-Object {
            $_ -match '(^|/)(release-key\.txt|.*private.*release.*key.*)$'
          })
          if ($trackedPrivate.Count -ne 0) {
            throw "A private release key appears to be tracked: $($trackedPrivate -join ', ')"
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  licenses:
    name: Generate locked dependency notices
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install exact locked npm tree without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove npm notice generator rejects missing source material
        run: node --test ../../tools/gogoke-release/generate-npm-notices.test.mjs
      - name: Generate npm production SPDX and bundled notice text
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path generated -Force | Out-Null
          npm sbom --omit=dev --sbom-format=spdx | Set-Content generated/npm-production.spdx.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "npm sbom failed: $LASTEXITCODE" }
          node ../../tools/gogoke-release/generate-npm-notices.mjs generated/npm-production.spdx.json generated/npm-production-notices.html
          if ($LASTEXITCODE -ne 0) { throw "npm notice generation failed: $LASTEXITCODE" }
      - name: Install pinned cargo-about into isolated runner root
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'cargo-about'
          cargo install --locked --version 0.8.4 cargo-about --root $toolRoot
          if ($LASTEXITCODE -ne 0) { throw "cargo-about install failed: $LASTEXITCODE" }
          "$(Join-Path $toolRoot 'bin')" >> $env:GITHUB_PATH
      - name: Generate Rust license and copyright text from locked graph
        shell: pwsh
        run: |
          Push-Location src-tauri
          try {
            cargo about generate -o ../generated/rust-dependency-notices.html about.hbs
            if ($LASTEXITCODE -ne 0) { throw "cargo-about generation failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          foreach ($path in @('generated/npm-production-notices.html', 'generated/rust-dependency-notices.html')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "license notice missing or empty: $path"
            }
          }
          $tree = @(cargo tree --locked --edges normal,build --target x86_64-pc-windows-msvc --prefix none --manifest-path src-tauri/Cargo.toml)
          if ($LASTEXITCODE -ne 0) { throw "Windows release dependency tree unavailable: $LASTEXITCODE" }
          if ($tree.Count -eq 0 -or $tree[0] -notmatch '^([^ ]+) v([^ ]+)') { throw "Windows dependency root identity unavailable" }
          $rootIdentity = "$($matches[1]) $($matches[2])"
          $expected = @($tree | ForEach-Object {
            if ($_ -match '^([^ ]+) v([^ ]+)') { "$($matches[1]) $($matches[2])" }
          } | Where-Object { $_ -ne $rootIdentity } | Sort-Object -Unique)
          $notice = Get-Content generated/rust-dependency-notices.html -Raw
          $listed = @([regex]::Matches($notice, '<li>([^<]+)</li>') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          if ($expected.Count -lt 100 -or $listed.Count -lt 100) { throw "Rust notice inventory is unexpectedly empty" }
          $missing = @(Compare-Object $expected $listed | Where-Object SideIndicator -eq '<=')
          if ($missing.Count -ne 0) { throw "Rust notice lacks Windows production dependencies: $($missing.InputObject -join ', ')" }
          $negative = @(Compare-Object @('missing-fixture 0.0.1') $listed | Where-Object SideIndicator -eq '<=')
          if ($negative.Count -ne 1) { throw "Rust notice coverage negative control did not fail" }
          Write-Output "Rust notice coverage: $($expected.Count) Windows dependency identities covered; negative control rejected"
      - name: Upload generated license evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-license-notices-${{ github.sha }}-${{ github.run_id }}
          path: |
            apps/desktop/generated/npm-production.spdx.json
            apps/desktop/generated/npm-production-notices.html
            apps/desktop/generated/rust-dependency-notices.html
          if-no-files-found: error
          retention-days: 30

  windows-build:
    name: Clean Windows build (${{ matrix.lane }})
    timeout-minutes: 75
    needs: [web, licenses]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [frozen, repro]
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Download notices from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: gogoke-license-notices-${{ github.sha }}-${{ github.run_id }}
          path: apps/desktop/generated
      - name: Require clean independent native outputs and notices
        shell: pwsh
        run: |
          foreach ($path in @('src-tauri/target', 'native-host/target')) {
            if (Test-Path -LiteralPath $path) { throw "Fresh runner unexpectedly contains native output: $path" }
          }
          foreach ($path in @('generated/npm-production-notices.html', 'generated/rust-dependency-notices.html')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Installer notice missing or empty: $path"
            }
          }
      - name: Install native build tools
        run: choco install cmake llvm -y --no-progress
      - name: Configure libclang
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run prepare:gogoke-icons
      - name: Test deterministic resource pack instrumentation
        shell: pwsh
        run: |
          Push-Location ../..
          try {
            python -m unittest tools.ci.test_gogoke_resource_pack tools.ci.test_gogoke_ci_frozen_artifact
            if ($LASTEXITCODE -ne 0) { throw "resource pack tests failed: $LASTEXITCODE" }
          } finally { Pop-Location }
      - name: Build and deploy actual T3 server from pinned lockfile
        shell: pwsh
        working-directory: third_party/t3code
        run: |
          pnpm install --filter 't3...' --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "T3 locked install failed: $LASTEXITCODE" }
          pnpm --filter t3 run build:bundle
          if ($LASTEXITCODE -ne 0) { throw "T3 server bundle failed: $LASTEXITCODE" }
          $service = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/resources/gogoke-service'
          pnpm --config.allow-unused-patches=true --config.node-linker=hoisted --filter t3 deploy $service --prod --legacy
          if ($LASTEXITCODE -ne 0) { throw "T3 server production deployment failed: $LASTEXITCODE" }
      - name: Stage exact signed Node runtime and controlled fixture
        shell: pwsh
        run: |
          $license = Join-Path $env:RUNNER_TEMP 'gogoke-node-v24.13.1-LICENSE'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/nodejs/node/v24.13.1/LICENSE' -OutFile $license
          if ((Get-Item -LiteralPath $license).Length -lt 1000) { throw 'Pinned Node LICENSE is unexpectedly short' }
          $service = 'src-tauri/resources/gogoke-service'
          node ../../tools/ci/gogoke-package-service.mjs stage $service $license
          if ($LASTEXITCODE -ne 0) { throw "service staging failed: $LASTEXITCODE" }
          $node = (Resolve-Path -LiteralPath "$service/runtime/node.exe").Path
          if ((Get-AuthenticodeSignature -LiteralPath $node).Status -ne 'Valid') { throw 'Staged Node runtime is not Authenticode-valid' }
          "GOGOKE_CONTROLLED_NODE_PATH=$node" >> $env:GITHUB_ENV
      - name: Build native host for exact staged Node
        shell: pwsh
        run: |
          $node = (Resolve-Path -LiteralPath 'src-tauri/resources/gogoke-service/runtime/node.exe').Path
          if ($env:GOGOKE_CONTROLLED_NODE_PATH -cne $node) { throw 'Native build Node binding differs from staged runtime' }
          cargo +1.85.1 build --locked --manifest-path native-host/Cargo.toml --bin gogoke-native-host --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "native host build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force 'src-tauri/binaries' | Out-Null
          Copy-Item -LiteralPath 'native-host/target/x86_64-pc-windows-msvc/release/gogoke-native-host.exe' -Destination 'src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe' -Force
      - name: Seal exact staged service and native package
        shell: pwsh
        run: |
          node ../../tools/ci/gogoke-package-service.mjs seal
          if ($LASTEXITCODE -ne 0) { throw "package seal failed: $LASTEXITCODE" }
          node ../../tools/ci/gogoke-package-service.mjs verify src-tauri/resources generated/gogoke-package-hashes.json
          if ($LASTEXITCODE -ne 0) { throw "staged resources failed byte check: $LASTEXITCODE" }
      - name: Test native release and resource trust paths
        shell: pwsh
        run: |
          cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml gogoke_update --lib
          if ($LASTEXITCODE -ne 0) { throw "gogoke update tests failed: $LASTEXITCODE" }
          cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml resource_trust --lib
          if ($LASTEXITCODE -ne 0) { throw "resource trust tests failed: $LASTEXITCODE" }
      - name: Build unsigned shell and NSIS installer
        run: npm run tauri:build:win:unsigned
      - name: Freeze resource pack, index, and executable identities
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $pack = Join-Path $env:RUNNER_TEMP 'gogoke-resources.windows.zip'
          $index = Join-Path $env:RUNNER_TEMP 'resource-index.json'
          $installedRoot = Join-Path $env:RUNNER_TEMP 'gogoke-installed-static'
          New-Item -ItemType Directory -Path $installedRoot | Out-Null
          foreach ($name in @('LICENSE', 'THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath $name -Destination (Join-Path $installedRoot $name)
          }
          Copy-Item -LiteralPath generated/npm-production-notices.html -Destination (Join-Path $installedRoot 'npm-production-notices.html')
          Copy-Item -LiteralPath generated/rust-dependency-notices.html -Destination (Join-Path $installedRoot 'rust-dependency-notices.html')
          $installedService = Join-Path $installedRoot 'gogoke-service'
          New-Item -ItemType Directory -Path $installedService | Out-Null
          foreach ($name in @('node_modules', 'fixtures')) {
            Copy-Item -LiteralPath (Join-Path 'src-tauri/resources/gogoke-service' $name) -Destination $installedService -Recurse
          }
          New-Item -ItemType Directory -Path (Join-Path $installedService 'runtime') | Out-Null
          Copy-Item -LiteralPath src-tauri/resources/gogoke-service/runtime/LICENSE -Destination (Join-Path $installedService 'runtime/LICENSE')
          foreach ($name in @('package.json', 'T3-LICENSE', 'T3-runtime-notices.html', 'native-host-notices.html')) {
            Copy-Item -LiteralPath (Join-Path 'src-tauri/resources/gogoke-service' $name) -Destination (Join-Path $installedService $name)
          }
          if (Test-Path -LiteralPath (Join-Path $installedRoot 'gogoke-service/runtime/node.exe')) {
            throw 'Installed static inventory must not contain the separately indexed Node executable.'
          }
          python ../../tools/ci/gogoke_resource_pack.py pack --frontend-dir dist --service-dist-dir src-tauri/resources/gogoke-service/dist --output $pack
          if ($LASTEXITCODE -ne 0) { throw "resource pack creation failed: $LASTEXITCODE" }
          python ../../tools/ci/gogoke_resource_pack.py index --pack $pack `
            --portable-shell src-tauri/target/release/gogoke.exe `
            --native-host src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe `
            --node src-tauri/resources/gogoke-service/runtime/node.exe `
            --source-commit '${{ github.sha }}' --version $version `
            --installed-root $installedRoot --output $index
          if ($LASTEXITCODE -ne 0) { throw "resource index creation failed: $LASTEXITCODE" }
          python ../../tools/ci/gogoke_resource_pack.py verify --pack $pack --index $index
          if ($LASTEXITCODE -ne 0) { throw "resource pack verification failed: $LASTEXITCODE" }
          $installers = @(Get-Item src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          foreach ($file in @($installers[0].FullName, 'src-tauri/target/release/gogoke.exe', 'src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe')) {
            if ((Get-AuthenticodeSignature -LiteralPath $file).Status -ne 'NotSigned') {
              throw "Unsigned build unexpectedly produced a signed executable: $file"
            }
          }
          python ../../tools/ci/gogoke_ci_frozen_artifact.py stage `
            --pack $pack --index $index `
            --portable-shell src-tauri/target/release/gogoke.exe `
            --native-host src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe `
            --node src-tauri/resources/gogoke-service/runtime/node.exe `
            --installer $installers[0].FullName `
            --package-inventory generated/gogoke-package-hashes.json `
            --source-commit '${{ github.sha }}' --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}' --lane '${{ matrix.lane }}' `
            --output frozen-artifact
          if ($LASTEXITCODE -ne 0) { throw "frozen artifact staging failed: $LASTEXITCODE" }
      - name: Select immutable artifact name
        id: artifact-name
        shell: pwsh
        run: |
          $name = if ('${{ matrix.lane }}' -ceq 'frozen') {
            'gogoke-windows-frozen-${{ github.sha }}-${{ github.run_id }}'
          } else {
            'gogoke-windows-repro-${{ github.sha }}-${{ github.run_id }}'
          }
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Upload immutable build lane
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: apps/desktop/frozen-artifact/*
          if-no-files-found: error
          retention-days: 30

  windows-reproducibility:
    name: Compare independent Windows executable bytes
    timeout-minutes: 15
    needs: [windows-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gogoke-windows-frozen-${{ github.sha }}-${{ github.run_id }}
          path: comparison/frozen
      - uses: actions/download-artifact@v4
        with:
          name: gogoke-windows-repro-${{ github.sha }}-${{ github.run_id }}
          path: comparison/repro
      - name: Require byte-identical raw shell, NSIS-patched shell, host, Node, pack, and index
        shell: pwsh
        run: |
          python tools/ci/gogoke_ci_frozen_artifact.py compare `
            --frozen comparison/frozen --repro comparison/repro `
            --source-commit '${{ github.sha }}' --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}' `
            --output comparison/gogoke-r2-06-reproducibility.json
          if ($LASTEXITCODE -ne 0) { throw "independent Windows byte comparison failed: $LASTEXITCODE" }
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-windows-reproducibility-${{ github.sha }}-${{ github.run_id }}
          path: comparison/gogoke-r2-06-reproducibility.json
          if-no-files-found: error
          retention-days: 30
