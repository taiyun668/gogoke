name: gogoke desktop CI

on:
  workflow_dispatch:
    inputs:
      web_only:
        description: "Browser iteration only; native builds, notices and byte comparison are NOT_RUN"
        type: boolean
        required: false
        default: false
      experimental_candidate:
        description: "Light candidate: Browser, notices and one frozen build; repro, compare and compile mutations are NOT_RUN"
        type: boolean
        required: false
        default: false
      update_loader_only:
        description: "Diagnose the native update test image loader on one frozen Windows runner; no candidate artifacts or stable gate"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "tools/sign-gogoke-release-manifest.ps1"
      - "tools/publish-gogoke-release.ps1"
      - "tools/smoke-gogoke-update.ps1"
      - "tools/gogoke-release/**"
      - "tools/ci/**"
      - "third_party/t3code/**"
      - ".github/workflows/gogoke-desktop.yml"
      - ".github/workflows/gogoke-candidate-sign.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "tools/sign-gogoke-release-manifest.ps1"
      - "tools/publish-gogoke-release.ps1"
      - "tools/smoke-gogoke-update.ps1"
      - "tools/gogoke-release/**"
      - "tools/ci/**"
      - "third_party/t3code/**"
      - ".github/workflows/gogoke-desktop.yml"
      - ".github/workflows/gogoke-candidate-sign.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_candidate && 'Experimental candidate Browser build and tests' || 'Browser build and tests' }}
    if: github.event_name != 'workflow_dispatch' || !inputs.update_loader_only
    timeout-minutes: 30
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Reject incompatible workflow modes
        if: github.event_name == 'workflow_dispatch' && inputs.web_only && inputs.experimental_candidate
        working-directory: .
        shell: pwsh
        run: throw 'web_only and experimental_candidate are mutually exclusive.'
      - name: Record selected check scope
        if: github.event_name == 'workflow_dispatch' && (inputs.web_only || inputs.experimental_candidate)
        working-directory: .
        shell: pwsh
        run: |
          $summary = if ('${{ inputs.experimental_candidate }}' -eq 'true') {
            @(
              '## Experimental candidate lightweight checks'
              ''
              '| Check | Evidence status |'
              '| --- | --- |'
              '| Browser build and tests | See this job''s actual result |'
              '| Generate locked dependency notices | See the notices job''s actual result |'
              '| Clean Windows build (frozen) and original artifact byte verification | See the frozen job''s actual result |'
              '| Clean Windows build (repro) | NOT_RUN |'
              '| Compare independent Windows executable bytes | NOT_RUN |'
              '| Unaffected native trust library tests and CI-only negative installer | NOT_RUN |'
              ''
              'This run is a lightweight experiment and cannot satisfy the complete stable integration gate; experimental resource signing remains subject to its trusted main verifier.'
            ) -join [Environment]::NewLine
          } else {
            @(
              '## Browser iteration only'
              ''
              '| Check | Evidence status |'
              '| --- | --- |'
              '| Browser build and tests | See this job''s actual result |'
              '| Generate locked dependency notices | NOT_RUN |'
              '| Clean Windows build (frozen) | NOT_RUN |'
              '| Clean Windows build (repro) | NOT_RUN |'
              '| Compare independent Windows executable bytes | NOT_RUN |'
              ''
              'This run cannot satisfy the complete integration or candidate build gate. Run again with web_only=false at the integration point or before producing a candidate.'
            ) -join [Environment]::NewLine
          }
          $summary >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind browser build to exact source commit and date
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -cne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Browser checkout differs from source head' }
          "GIT_COMMIT=$commit" >> $env:GITHUB_ENV
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          "GIT_BRANCH=$branch" >> $env:GITHUB_ENV
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($epoch -notmatch '^[0-9]+$') { throw 'Source commit timestamp is unavailable' }
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check:product-identity
      - name: Check actual USER policy receipt boundaries
        run: node ../../tools/e2e/design37-policy-receipt-check.mjs
      - name: Parse candidate installed preflight and product smoke scripts
        shell: pwsh
        run: |
          foreach ($name in @('gogoke-candidate-installed-preflight.ps1',
                              'gogoke-r2-06-candidate-installed-smoke.ps1',
                              'gogoke-r206a-installer-negative.ps1')) {
            $path = (Resolve-Path "../../tools/ci/$name").Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$name has $($errors.Count) PowerShell parse errors." }
          }
      - name: Verify full-update readiness argument quoting on cloud Windows
        shell: powershell
        run: |
          & ../../tools/ci/test_gogoke_update_ready_argument_cloud.ps1 -Source src-tauri/update/gogoke-update-coordinator.ps1
      - name: Check release trust boundary
        shell: pwsh
        run: |
          $public = (Get-Content src-tauri/gogoke-release-public-key.txt -Raw).Trim()
          if ($public -notmatch '^[0-9A-Fa-f]{128}$') {
            throw "gogoke release public key must be P-256 X||Y"
          }
          $trackedPrivate = @(git ls-files | Where-Object {
            $_ -match '(^|/)(release-key\.txt|.*private.*release.*key.*)$'
          })
          if ($trackedPrivate.Count -ne 0) {
            throw "A private release key appears to be tracked: $($trackedPrivate -join ', ')"
          }
      - run: npm run typecheck
      - run: npm test
      - name: Exercise embedded uninstall finalizer on clean cloud Windows
        shell: pwsh
        run: |
          python ../../tools/ci/test_gogoke_uninstall_finalizer_cloud.py -v
          if ($LASTEXITCODE -ne 0) { throw "uninstall finalizer cloud test failed: $LASTEXITCODE" }
      - name: Exercise full-update owned backup cleanup on clean cloud Windows
        shell: pwsh
        run: |
          python ../../tools/ci/test_gogoke_update_backup_cleanup_cloud.py -v
          if ($LASTEXITCODE -ne 0) { throw "update backup cleanup cloud test failed: $LASTEXITCODE" }
      - run: npm run build

  licenses:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_candidate && 'Experimental candidate dependency notices' || 'Generate locked dependency notices' }}
    if: github.event_name != 'workflow_dispatch' || !inputs.web_only
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install exact locked npm tree without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove npm notice generator rejects missing source material
        run: node --test ../../tools/gogoke-release/generate-npm-notices.test.mjs
      - name: Generate npm production SPDX and bundled notice text
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path generated -Force | Out-Null
          npm sbom --omit=dev --sbom-format=spdx | Set-Content generated/npm-production.spdx.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "npm sbom failed: $LASTEXITCODE" }
          node ../../tools/gogoke-release/generate-npm-notices.mjs generated/npm-production.spdx.json generated/npm-production-notices.html
          if ($LASTEXITCODE -ne 0) { throw "npm notice generation failed: $LASTEXITCODE" }
      - name: Install pinned cargo-about into isolated runner root
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'cargo-about'
          cargo install --locked --version 0.8.4 cargo-about --root $toolRoot
          if ($LASTEXITCODE -ne 0) { throw "cargo-about install failed: $LASTEXITCODE" }
          "$(Join-Path $toolRoot 'bin')" >> $env:GITHUB_PATH
      - name: Generate Rust license and copyright text from locked graph
        shell: pwsh
        run: |
          Push-Location src-tauri
          try {
            cargo about generate -o ../generated/rust-dependency-notices.html about.hbs
            if ($LASTEXITCODE -ne 0) { throw "cargo-about generation failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          foreach ($path in @('generated/npm-production-notices.html', 'generated/rust-dependency-notices.html')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "license notice missing or empty: $path"
            }
          }
          $tree = @(cargo tree --locked --edges normal,build --target x86_64-pc-windows-msvc --prefix none --manifest-path src-tauri/Cargo.toml)
          if ($LASTEXITCODE -ne 0) { throw "Windows release dependency tree unavailable: $LASTEXITCODE" }
          if ($tree.Count -eq 0 -or $tree[0] -notmatch '^([^ ]+) v([^ ]+)') { throw "Windows dependency root identity unavailable" }
          $rootIdentity = "$($matches[1]) $($matches[2])"
          $expected = @($tree | ForEach-Object {
            if ($_ -match '^([^ ]+) v([^ ]+)') { "$($matches[1]) $($matches[2])" }
          } | Where-Object { $_ -ne $rootIdentity } | Sort-Object -Unique)
          $notice = Get-Content generated/rust-dependency-notices.html -Raw
          $listed = @([regex]::Matches($notice, '<li>([^<]+)</li>') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          if ($expected.Count -lt 100 -or $listed.Count -lt 100) { throw "Rust notice inventory is unexpectedly empty" }
          $missing = @(Compare-Object $expected $listed | Where-Object SideIndicator -eq '<=')
          if ($missing.Count -ne 0) { throw "Rust notice lacks Windows production dependencies: $($missing.InputObject -join ', ')" }
          $negative = @(Compare-Object @('missing-fixture 0.0.1') $listed | Where-Object SideIndicator -eq '<=')
          if ($negative.Count -ne 1) { throw "Rust notice coverage negative control did not fail" }
          Write-Output "Rust notice coverage: $($expected.Count) Windows dependency identities covered; negative control rejected"
      - name: Upload generated license evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-license-notices-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            apps/desktop/generated/npm-production.spdx.json
            apps/desktop/generated/npm-production-notices.html
            apps/desktop/generated/rust-dependency-notices.html
          if-no-files-found: error
          retention-days: 30

  windows-build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.update_loader_only && 'Update test image loader diagnostic (frozen)' || (github.event_name == 'workflow_dispatch' && inputs.experimental_candidate && format('Experimental candidate Windows build ({0})', matrix.lane) || format('Clean Windows build ({0})', matrix.lane)) }}
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.update_loader_only && needs.licenses.result == 'success') || ((github.event_name != 'workflow_dispatch' || (!inputs.web_only && !inputs.update_loader_only)) && needs.web.result == 'success' && needs.licenses.result == 'success'))
    timeout-minutes: 75
    needs: [web, licenses]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.experimental_candidate || inputs.update_loader_only) && '["frozen"]' || '["frozen","repro"]') }}
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      RUSTFLAGS: "-C link-arg=/Brepro"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Reject incompatible loader diagnostic modes
        if: github.event_name == 'workflow_dispatch' && inputs.update_loader_only && (inputs.web_only || inputs.experimental_candidate)
        shell: pwsh
        run: throw 'update_loader_only cannot be combined with web_only or experimental_candidate.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind Windows build to exact source commit and date
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -cne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Windows checkout differs from source head' }
          "GIT_COMMIT=$commit" >> $env:GITHUB_ENV
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          "GIT_BRANCH=$branch" >> $env:GITHUB_ENV
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($epoch -notmatch '^[0-9]+$') { throw 'Source commit timestamp is unavailable' }
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Select the common pinned MSVC and Windows SDK toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -ne 1) {
            throw 'The pinned MSVC 14.44 toolset is unavailable on this runner.'
          }
          $vcvars = Join-Path $installations[0] 'VC/Auxiliary/Build/vcvarsall.bat'
          $command = 'call "' + $vcvars + '" amd64 10.0.26100.0 -vcvars_ver=14.44 >nul && set'
          $dump = @(& $env:ComSpec /d /c $command)
          if ($LASTEXITCODE -ne 0) { throw 'Could not activate the pinned MSVC and Windows SDK toolchain.' }
          $vars = [Collections.Generic.Dictionary[string,string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($line in $dump) {
            if ($line -match '^([^=]+)=(.*)$') { $vars[$matches[1]] = $matches[2] }
          }
          if (-not $vars.ContainsKey('VCToolsVersion') -or $vars['VCToolsVersion'] -notmatch '^14\.44\.' -or
              -not $vars.ContainsKey('WindowsSDKVersion') -or $vars['WindowsSDKVersion'] -notmatch '^10\.0\.26100\.0\\?$' -or
              -not $vars.ContainsKey('VCToolsInstallDir')) {
            throw 'Activated MSVC or Windows SDK identity is not the pinned version.'
          }
          $bin = Join-Path $vars['VCToolsInstallDir'] 'bin/Hostx64/x64'
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'cl.exe') -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $bin 'link.exe') -PathType Leaf)) {
            throw 'Pinned MSVC compiler or linker is missing.'
          }
          $bin >> $env:GITHUB_PATH
          foreach ($name in @('VCToolsVersion', 'VCToolsInstallDir', 'WindowsSDKVersion', 'WindowsSdkDir',
                'UniversalCRTSdkDir', 'UCRTVersion', 'INCLUDE', 'LIB', 'LIBPATH')) {
            if (-not $vars.ContainsKey($name)) { throw "Pinned toolchain environment lacks $name" }
            "$name=$($vars[$name])" >> $env:GITHUB_ENV
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(Join-Path $bin 'link.exe')" >> $env:GITHUB_ENV
          "CC=$(Join-Path $bin 'cl.exe')" >> $env:GITHUB_ENV
          "CXX=$(Join-Path $bin 'cl.exe')" >> $env:GITHUB_ENV
          Write-Output "Pinned Windows toolchain: MSVC $($vars['VCToolsVersion']); SDK $($vars['WindowsSDKVersion'])"
      - name: Prove the pinned MSVC C tools are selected
        shell: pwsh
        run: |
          $bin = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64'
          foreach ($tool in @('cl.exe', 'link.exe')) {
            $actual = (Get-Command $tool -ErrorAction Stop).Source
            if (-not [string]::Equals([IO.Path]::GetFullPath($actual),
                [IO.Path]::GetFullPath((Join-Path $bin $tool)), [StringComparison]::OrdinalIgnoreCase)) {
              throw "The active $tool is not from the pinned MSVC toolset."
            }
          }
      - name: Download notices from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: gogoke-license-notices-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: apps/desktop/generated
      - name: Require clean independent native outputs and notices
        shell: pwsh
        run: |
          foreach ($path in @('src-tauri/target', 'native-host/target')) {
            if (Test-Path -LiteralPath $path) { throw "Fresh runner unexpectedly contains native output: $path" }
          }
          foreach ($path in @('generated/npm-production-notices.html', 'generated/rust-dependency-notices.html')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Installer notice missing or empty: $path"
            }
          }
      - name: Install native build tools
        run: choco install cmake llvm -y --no-progress
      - name: Configure libclang
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run prepare:gogoke-icons
      - name: Test deterministic resource pack instrumentation
        if: github.event_name != 'workflow_dispatch' || !inputs.update_loader_only
        shell: pwsh
        run: |
          Push-Location ../..
          try {
            python -m unittest tools.ci.test_gogoke_resource_pack tools.ci.test_gogoke_ci_frozen_artifact
            if ($LASTEXITCODE -ne 0) { throw "resource pack tests failed: $LASTEXITCODE" }
          } finally { Pop-Location }
      - name: Build and deploy actual T3 server from pinned lockfile
        shell: pwsh
        working-directory: third_party/t3code
        run: |
          pnpm install --filter 't3...' --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "T3 locked install failed: $LASTEXITCODE" }
          pnpm --filter t3 run build:bundle
          if ($LASTEXITCODE -ne 0) { throw "T3 server bundle failed: $LASTEXITCODE" }
          $service = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/resources/gogoke-service'
          pnpm --config.allow-unused-patches=true --config.node-linker=hoisted --filter t3 deploy $service --prod --legacy
          if ($LASTEXITCODE -ne 0) { throw "T3 server production deployment failed: $LASTEXITCODE" }
      - name: Stage exact signed Node runtime and controlled fixture
        shell: pwsh
        run: |
          $license = Join-Path $env:RUNNER_TEMP 'gogoke-node-v24.13.1-LICENSE'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/nodejs/node/v24.13.1/LICENSE' -OutFile $license
          if ((Get-Item -LiteralPath $license).Length -lt 1000) { throw 'Pinned Node LICENSE is unexpectedly short' }
          $service = 'src-tauri/resources/gogoke-service'
          node ../../tools/ci/gogoke-package-service.mjs stage $service $license
          if ($LASTEXITCODE -ne 0) { throw "service staging failed: $LASTEXITCODE" }
          $node = (Resolve-Path -LiteralPath "$service/runtime/node.exe").Path
          if ((Get-AuthenticodeSignature -LiteralPath $node).Status -ne 'Valid') { throw 'Staged Node runtime is not Authenticode-valid' }
          "GOGOKE_CONTROLLED_NODE_PATH=$node" >> $env:GITHUB_ENV
          $holder = (Get-Command powershell.exe -ErrorAction Stop).Source
          if ((Get-AuthenticodeSignature -LiteralPath $holder).Status -ne 'Valid') { throw 'Controlled file-holding child is not Authenticode-valid' }
          "GOGOKE_CONTROLLED_HOLD_CHILD_PATH=$holder" >> $env:GITHUB_ENV
      - name: Build native host for exact staged Node
        shell: pwsh
        run: |
          $node = (Resolve-Path -LiteralPath 'src-tauri/resources/gogoke-service/runtime/node.exe').Path
          if ($env:GOGOKE_CONTROLLED_NODE_PATH -cne $node) { throw 'Native build Node binding differs from staged runtime' }
          $sysroot = (& rustc +1.85.1 --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the pinned native-host Rust sysroot.' }
          $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw "Pinned native-host linker missing: $linker" }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = (Resolve-Path -LiteralPath $linker).Path
          $env:RUSTFLAGS = '-C linker-flavor=lld-link -C link-arg=/Brepro -C link-arg=/DEBUG:NONE'
          Write-Output "Native-host linker: $linker; SHA-256 $((Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash)"
          cargo +1.85.1 build --locked --manifest-path native-host/Cargo.toml --bin gogoke-native-host --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "native host build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force 'src-tauri/binaries' | Out-Null
          Copy-Item -LiteralPath 'native-host/target/x86_64-pc-windows-msvc/release/gogoke-native-host.exe' -Destination 'src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe' -Force
      - name: Seal exact staged service and native package
        shell: pwsh
        run: |
          node ../../tools/ci/gogoke-package-service.mjs seal
          if ($LASTEXITCODE -ne 0) { throw "package seal failed: $LASTEXITCODE" }
          node ../../tools/ci/gogoke-package-service.mjs verify src-tauri/resources generated/gogoke-package-hashes.json
          if ($LASTEXITCODE -ne 0) { throw "staged resources failed byte check: $LASTEXITCODE" }
      - name: Reproduce native update test image loader failure
        if: github.event_name == 'workflow_dispatch' && inputs.update_loader_only
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'gogoke-update-loader-diagnostic'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $buildOut = Join-Path $evidence 'cargo-build.jsonl'
          $buildErr = Join-Path $evidence 'cargo-build.stderr.txt'
          & cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json 1> $buildOut 2> $buildErr
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $buildErr -Tail 80 | Out-Host
            throw "Exact native test image build failed: $LASTEXITCODE"
          }
          $images = @(Get-Content -LiteralPath $buildOut | ForEach-Object {
            try { $_ | ConvertFrom-Json -ErrorAction Stop } catch { $null }
          } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'gogoke_desktop_lib' -and
            $_.target.kind -contains 'lib' -and $_.profile.test -eq $true -and $_.executable
          } | ForEach-Object { $_.executable } | Select-Object -Unique)
          if ($images.Count -ne 1) { throw "Expected one actual desktop lib test image; found $($images.Count)" }
          $image = (Resolve-Path -LiteralPath $images[0]).Path
          $expectedRoot = [IO.Path]::GetFullPath((Join-Path (Get-Location).Path 'src-tauri/target/debug/deps')) + [IO.Path]::DirectorySeparatorChar
          if (-not $image.StartsWith($expectedRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Test image escaped expected Cargo output: $image"
          }
          $imageHash = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant()
          $cargo = (Get-Command cargo -ErrorAction Stop).Source
          if ([IO.Path]::GetExtension($cargo) -cne '.exe') { throw "Cargo is not an executable: $cargo" }
          $cargoVersion = (& $cargo +1.89.0 --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $cargoVersion -notmatch '^cargo 1\.89\.0 ') { throw "Unexpected Cargo toolchain: $cargoVersion" }
          [ordered]@{
            schema='gogoke.update-loader-diagnostic.v1'
            sourceCommit=(git rev-parse HEAD).Trim()
            originalFailedRun='38079237420'
            diagnosticOnly=$true
            imagePath=$image
            imageSha256=$imageHash
            cargoPath=$cargo
            cargoSha256=(Get-FileHash -LiteralPath $cargo -Algorithm SHA256).Hash.ToLowerInvariant()
            cargoVersion=$cargoVersion
            filter='gogoke_update'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'identity.json') -Encoding utf8
          Write-Output "Exact test image: $image; SHA-256 $imageHash"
          $originalOut = Join-Path $evidence 'original-cargo-stdout.txt'
          $originalErr = Join-Path $evidence 'original-cargo-stderr.txt'
          & $cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml gogoke_update --lib -vv 1> $originalOut 2> $originalErr
          $originalExit = $LASTEXITCODE
          $originalText = (Get-Content -LiteralPath $originalOut -Raw) + (Get-Content -LiteralPath $originalErr -Raw)
          [ordered]@{cargoExitCode=$originalExit;entrypointStatusRecorded=($originalText -match '0xc0000139|STATUS_ENTRYPOINT_NOT_FOUND')} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'original-cargo-exit.json') -Encoding utf8
          Get-Content -LiteralPath $originalErr -Tail 50 | Out-Host
          if ($originalExit -eq 0 -or $originalText -notmatch '0xc0000139|STATUS_ENTRYPOINT_NOT_FOUND') {
            throw "Original Cargo child loader failure did not reproduce: cargo exit $originalExit"
          }
          if ((Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant() -cne $imageHash) {
            throw 'Original Cargo test changed the captured image bytes'
          }
          $dumpbin = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/dumpbin.exe'
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) { throw 'Pinned MSVC dumpbin unavailable' }
          $imports = Join-Path $evidence 'test-image-imports.txt'
          & $dumpbin /imports $image 1> $imports
          if ($LASTEXITCODE -ne 0) { throw "Test image import table unavailable: $LASTEXITCODE" }

          $debuggers = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64'
          $gflags = Join-Path $debuggers 'gflags.exe'
          $cdb = Join-Path $debuggers 'cdb.exe'
          foreach ($tool in @($gflags, $cdb)) {
            if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw "Microsoft Debugging Tools missing on this runner: $tool" }
            $signature = Get-AuthenticodeSignature -LiteralPath $tool
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "Microsoft Debugging Tool signature invalid: $tool"
            }
            Write-Output "Debugging tool: $tool; version $((Get-Item -LiteralPath $tool).VersionInfo.FileVersion); SHA-256 $((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash)"
          }
          'Loader diagnostic only: original Cargo child then CDB child tracking; Browser, reproducibility, candidate signing and installation are NOT_RUN.' >> $env:GITHUB_STEP_SUMMARY
          $imageName = [IO.Path]::GetFileName($image)
          $diagnosticError = $null
          $cleanupError = $null
          try {
            & $gflags /i $imageName +sls
            if ($LASTEXITCODE -ne 0) { throw "Loader snaps enable failed: $LASTEXITCODE" }
            $log = Join-Path $evidence 'cdb-loader-snaps.log'
            $info = [Diagnostics.ProcessStartInfo]::new($cdb)
            foreach ($argument in @('-o', '-g', '-G', '-v', '-logo', $log, $cargo, '+1.89.0', 'test', '--locked', '--manifest-path', 'src-tauri/Cargo.toml', 'gogoke_update', '--lib', '-vv')) {
              [void]$info.ArgumentList.Add($argument)
            }
            $info.WorkingDirectory = (Get-Location).Path
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $debugger = [Diagnostics.Process]::Start($info)
            if (-not $debugger) { throw 'Microsoft CDB did not start' }
            $stdout = $debugger.StandardOutput.ReadToEndAsync()
            $stderr = $debugger.StandardError.ReadToEndAsync()
            $timedOut = -not $debugger.WaitForExit(120000)
            if ($timedOut) {
              $debugger.Kill($true)
              $debugger.WaitForExit()
            }
            [IO.File]::WriteAllText((Join-Path $evidence 'cdb-stdout.txt'), $stdout.GetAwaiter().GetResult())
            [IO.File]::WriteAllText((Join-Path $evidence 'cdb-stderr.txt'), $stderr.GetAwaiter().GetResult())
            if ($timedOut) { throw 'Microsoft CDB loader diagnosis timed out; raw log retained' }
            Write-Output "Microsoft CDB exit: $($debugger.ExitCode)"
            if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw 'CDB did not write loader snaps' }
            Get-Content -LiteralPath $log | Select-String -Pattern 'gogoke_desktop_lib|ModLoad|c0000139|entry point|procedure|LdrpSnapThunk|ERROR' -Context 2,2 |
              Select-Object -Last 50 | Out-Host
            if ((Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant() -cne $imageHash) {
              throw 'CDB-wrapped Cargo test changed the captured image bytes'
            }
          } catch {
            $diagnosticError = $_.Exception.Message
          } finally {
            & $gflags /i $imageName -sls
            if ($LASTEXITCODE -ne 0) { $cleanupError = "Loader snaps cleanup failed: $LASTEXITCODE" }
          }
          $errors = @($diagnosticError, $cleanupError) | Where-Object { $_ }
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
      - name: Upload native update loader diagnostic evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_loader_only
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-update-loader-only-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogoke-update-loader-diagnostic/*
          if-no-files-found: warn
          retention-days: 30
      - name: Test native release and resource trust paths
        if: github.event_name != 'workflow_dispatch' || (!inputs.experimental_candidate && !inputs.update_loader_only)
        shell: pwsh
        env:
          GOGOKE_BUILD_LANE: ${{ matrix.lane }}
        run: |
          cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml gogoke_update --lib
          if ($LASTEXITCODE -ne 0) { throw "gogoke update tests failed: $LASTEXITCODE" }
          cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml resource_trust --lib
          if ($LASTEXITCODE -ne 0) { throw "resource trust tests failed: $LASTEXITCODE" }
          $custody = & cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml cancelled_reply_retains_job_and_lease_until_accounted_settlement --lib 2>&1
          $custody | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (@($custody | Where-Object { $_ -match 'test result: ok\. 1 passed; 0 failed' }).Count -eq 1)) {
            throw "Product process custody test failed or did not execute exactly one test: $LASTEXITCODE"
          }
          $outerJob = & cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml outer_job_owner_hard_exit_kills_suspended_node --lib 2>&1
          $outerJob | Out-Host
          if ($LASTEXITCODE -ne 0 -or
              @($outerJob | Where-Object { $_ -match 'test result: ok\. 1 passed; 0 failed; 0 ignored' }).Count -ne 1 -or
              @($outerJob | Where-Object { $_ -match '^test .*outer_job_owner_hard_exit_kills_suspended_node \.\.\. ok$' }).Count -ne 1) {
            throw "Outer Job hard-owner-exit test failed, skipped, or did not execute exactly once: $LASTEXITCODE"
          }
          $poisonedModule = & cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml managed_product_launch_rejects_poisoned_generation_module --lib 2>&1
          $poisonedModule | Out-Host
          if ($LASTEXITCODE -ne 0 -or
              @($poisonedModule | Where-Object { $_ -match 'test result: ok\. 1 passed; 0 failed; 0 ignored' }).Count -ne 1 -or
              @($poisonedModule | Where-Object { $_ -match '^test .*managed_product_launch_rejects_poisoned_generation_module \.\.\. ok$' }).Count -ne 1) {
            throw "Poisoned generation module test failed, skipped, or did not execute exactly once: $LASTEXITCODE"
          }
          cargo +1.89.0 test --locked --manifest-path src-tauri/Cargo.toml gogoke_uninstall --lib
          if ($LASTEXITCODE -ne 0) { throw "gogoke uninstall tests failed: $LASTEXITCODE" }
      - name: Upload one-shot task deletion receipt
        if: github.event_name != 'workflow_dispatch' || (!inputs.experimental_candidate && !inputs.update_loader_only)
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-job-custody-delete-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogoke-job-custody-delete-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Build unsigned shell and NSIS installer
        if: github.event_name != 'workflow_dispatch' || !inputs.update_loader_only
        shell: pwsh
        run: |
          $sysroot = (& rustc +1.89.0 --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the pinned shell Rust sysroot.' }
          $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw "Pinned shell linker missing: $linker" }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = (Resolve-Path -LiteralPath $linker).Path
          $env:RUSTFLAGS = '-C linker-flavor=lld-link -C link-arg=/Brepro -C link-arg=/DEBUG:NONE'
          $env:GOGOKE_NSIS_HASH_HELPER = (Resolve-Path -LiteralPath '../../tools/ci/gogoke-nsis-payload.ps1').Path
          Write-Output "Shell linker: $linker; SHA-256 $((Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash)"
          npm run tauri:build:win:unsigned
          if ($LASTEXITCODE -ne 0) { throw "shell or installer build failed: $LASTEXITCODE" }
      - name: Freeze resource pack, index, and executable identities
        if: github.event_name != 'workflow_dispatch' || !inputs.update_loader_only
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $pack = Join-Path $env:RUNNER_TEMP 'gogoke-resources.windows.zip'
          $index = Join-Path $env:RUNNER_TEMP 'resource-index.json'
          $installedRoot = Join-Path $env:RUNNER_TEMP 'gogoke-installed-static'
          New-Item -ItemType Directory -Path $installedRoot | Out-Null
          foreach ($name in @('LICENSE', 'THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath $name -Destination (Join-Path $installedRoot $name)
          }
          # Tauri's NSIS bundle installs this existing daemon next to gogoke.exe.
          # Include its exact built bytes in the signed installed-file inventory
          # so product verification and --uninstall own the same file.
          $daemon = 'src-tauri/target/release/gogoke_daemon.exe'
          if (-not (Test-Path -LiteralPath $daemon -PathType Leaf)) {
            throw 'Tauri bundled daemon is missing from the release build.'
          }
          Copy-Item -LiteralPath $daemon -Destination (Join-Path $installedRoot 'gogoke_daemon.exe')
          Copy-Item -LiteralPath generated/npm-production-notices.html -Destination (Join-Path $installedRoot 'npm-production-notices.html')
          Copy-Item -LiteralPath generated/rust-dependency-notices.html -Destination (Join-Path $installedRoot 'rust-dependency-notices.html')
          $installedService = Join-Path $installedRoot 'gogoke-service'
          New-Item -ItemType Directory -Path $installedService | Out-Null
          foreach ($name in @('node_modules', 'fixtures')) {
            Copy-Item -LiteralPath (Join-Path 'src-tauri/resources/gogoke-service' $name) -Destination $installedService -Recurse
          }
          New-Item -ItemType Directory -Path (Join-Path $installedService 'runtime') | Out-Null
          Copy-Item -LiteralPath src-tauri/resources/gogoke-service/runtime/LICENSE -Destination (Join-Path $installedService 'runtime/LICENSE')
          foreach ($name in @('package.json', 'T3-LICENSE', 'T3-runtime-notices.html', 'native-host-notices.html')) {
            Copy-Item -LiteralPath (Join-Path 'src-tauri/resources/gogoke-service' $name) -Destination (Join-Path $installedService $name)
          }
          if (Test-Path -LiteralPath (Join-Path $installedRoot 'gogoke-service/runtime/node.exe')) {
            throw 'Installed static inventory must not contain the separately indexed Node executable.'
          }
          python ../../tools/ci/gogoke_resource_pack.py pack --frontend-dir dist --service-dist-dir src-tauri/resources/gogoke-service/dist --output $pack
          if ($LASTEXITCODE -ne 0) { throw "resource pack creation failed: $LASTEXITCODE" }
          python ../../tools/ci/gogoke_resource_pack.py index --pack $pack `
            --portable-shell src-tauri/target/release/gogoke.exe `
            --native-host src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe `
            --node src-tauri/resources/gogoke-service/runtime/node.exe `
            --source-commit '${{ github.event.pull_request.head.sha || github.sha }}' --version $version `
            --installed-root $installedRoot --output $index
          if ($LASTEXITCODE -ne 0) { throw "resource index creation failed: $LASTEXITCODE" }
          python ../../tools/ci/gogoke_resource_pack.py verify --pack $pack --index $index
          if ($LASTEXITCODE -ne 0) { throw "resource pack verification failed: $LASTEXITCODE" }
          $installers = @(Get-Item src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          foreach ($file in @($installers[0].FullName, 'src-tauri/target/release/gogoke.exe', 'src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe')) {
            if ((Get-AuthenticodeSignature -LiteralPath $file).Status -ne 'NotSigned') {
              throw "Unsigned build unexpectedly produced a signed executable: $file"
            }
          }
          python ../../tools/ci/gogoke_ci_frozen_artifact.py stage `
            --pack $pack --index $index `
            --portable-shell src-tauri/target/release/gogoke.exe `
            --native-host src-tauri/binaries/gogoke-native-host-x86_64-pc-windows-msvc.exe `
            --node src-tauri/resources/gogoke-service/runtime/node.exe `
            --installer $installers[0].FullName `
            --package-inventory generated/gogoke-package-hashes.json `
            --source-commit '${{ github.event.pull_request.head.sha || github.sha }}' --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}' --lane '${{ matrix.lane }}' `
            --output frozen-artifact
          if ($LASTEXITCODE -ne 0) { throw "frozen artifact staging failed: $LASTEXITCODE" }
      - name: Package formal unsigned portable ZIP from frozen shell
        if: matrix.lane == 'frozen' && (github.event_name != 'workflow_dispatch' || !inputs.update_loader_only)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installedRoot = Join-Path $env:RUNNER_TEMP 'gogoke-installed-static'
          $portable = Join-Path 'portable-artifact' "gogoke-$version-windows-x64-unsigned-portable.zip"
          python ../../tools/ci/gogoke_ci_frozen_artifact.py portable `
            --frozen frozen-artifact --installed-root $installedRoot `
            --source-commit '${{ github.event.pull_request.head.sha || github.sha }}' --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}' --output $portable
          if ($LASTEXITCODE -ne 0) { throw "portable ZIP packaging failed: $LASTEXITCODE" }
      - name: Upload formal unsigned portable ZIP
        if: matrix.lane == 'frozen' && (github.event_name != 'workflow_dispatch' || !inputs.update_loader_only)
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-windows-portable-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: apps/desktop/portable-artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Select immutable artifact name
        if: github.event_name != 'workflow_dispatch' || !inputs.update_loader_only
        id: artifact-name
        shell: pwsh
        run: |
          $name = if ('${{ matrix.lane }}' -ceq 'frozen') {
            'gogoke-windows-frozen-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          } else {
            'gogoke-windows-repro-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          }
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Upload immutable build lane
        if: github.event_name != 'workflow_dispatch' || !inputs.update_loader_only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: apps/desktop/frozen-artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Build separate CI-barrier installer for negative installation axes
        if: matrix.lane == 'frozen' && github.event_name == 'workflow_dispatch' && !inputs.experimental_candidate && !inputs.update_loader_only
        shell: pwsh
        run: |
          $sysroot = (& rustc +1.89.0 --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Pinned shell Rust sysroot unavailable for test installer.' }
          $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw 'Pinned shell linker unavailable for test installer.' }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = (Resolve-Path -LiteralPath $linker).Path
          $env:RUSTFLAGS = '-C linker-flavor=lld-link -C link-arg=/Brepro -C link-arg=/DEBUG:NONE'
          $env:GOGOKE_NSIS_HASH_HELPER = (Resolve-Path -LiteralPath '../../tools/ci/gogoke-nsis-payload.ps1').Path
          # This is compiled into a separate CI-only setup. The frozen setup
          # uploaded above never contains a test barrier.
          $env:GOGOKE_NSIS_TEST_BARRIER = '$TEMP\gogoke-r206a-test-barrier'
          $expectedShell = (Get-FileHash -LiteralPath 'frozen-artifact/gogoke-portable.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          npm run tauri:build:win:unsigned
          if ($LASTEXITCODE -ne 0) { throw "CI-barrier installer build failed: $LASTEXITCODE" }
          $actualShell = (Get-FileHash -LiteralPath 'src-tauri/target/release/gogoke.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualShell -cne $expectedShell) { throw 'CI-barrier build changed frozen production shell bytes.' }
          $setups = @(Get-Item 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($setups.Count -ne 1) { throw 'CI-barrier build did not produce exactly one setup.' }
          $directory = 'nsis-negative-artifact'
          New-Item -ItemType Directory -Path $directory | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination (Join-Path $directory 'gogoke-r206a-test-setup.exe')
          $testHash = (Get-FileHash -LiteralPath (Join-Path $directory 'gogoke-r206a-test-setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $frozenSetup = Join-Path 'frozen-artifact' "gogoke-$version-windows-x64-unsigned-setup.exe"
          if ($testHash -ceq (Get-FileHash -LiteralPath $frozenSetup -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'CI-barrier setup is identical to the frozen production setup.'
          }
          [ordered]@{schema='gogoke.r2-06a.nsis-negative-instrument.v1';sourceCommit='${{ github.event.pull_request.head.sha || github.sha }}';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}';setupSha256=$testHash;productionShellSha256=$expectedShell;barrier='CI_ONLY'} |
            ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $directory 'instrument.json') -Encoding utf8
      - name: Upload separate CI-barrier installer
        if: matrix.lane == 'frozen' && github.event_name == 'workflow_dispatch' && !inputs.experimental_candidate && !inputs.update_loader_only
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-nsis-negative-${{ github.sha }}-${{ github.run_id }}
          path: apps/desktop/nsis-negative-artifact/*
          if-no-files-found: error
          retention-days: 30

  windows-reproducibility:
    name: Compare independent Windows executable bytes
    if: github.event_name != 'workflow_dispatch' || (!inputs.web_only && !inputs.experimental_candidate && !inputs.update_loader_only)
    timeout-minutes: 15
    needs: [windows-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gogoke-windows-frozen-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: comparison/frozen
      - uses: actions/download-artifact@v4
        with:
          name: gogoke-windows-repro-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: comparison/repro
      - name: Require byte-identical raw shell, NSIS-patched shell, host, Node, pack, and index
        shell: pwsh
        run: |
          python tools/ci/gogoke_ci_frozen_artifact.py compare `
            --frozen comparison/frozen --repro comparison/repro `
            --source-commit '${{ github.event.pull_request.head.sha || github.sha }}' --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}' `
            --output comparison/gogoke-r2-06-reproducibility.json
          if ($LASTEXITCODE -ne 0) { throw "independent Windows byte comparison failed: $LASTEXITCODE" }
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-windows-reproducibility-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: comparison/gogoke-r2-06-reproducibility.json
          if-no-files-found: error
          retention-days: 30
