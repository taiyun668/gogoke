              @{ id = 'grok-cold-original'; filter = 'cold_old_file_id_reacquires_only_inside_original_home' }
              @{ id = 'grok-home-refusal'; filter = 'wrong_home_and_reparse_refuse_without_target_sid_write' }
              @{ id = 'grok-intent-recovery'; filter = 'inherited_successor_intent_recovers_after_acl_write_before_finish' }
              @{ id = 'grok-applied-peer'; filter = 'applied_root_effect_survives_later_authorized_peer_sid_revocation' }
