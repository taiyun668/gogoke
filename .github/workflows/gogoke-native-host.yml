name: gogoke native-host CI

on:
  workflow_dispatch:
    inputs:
      trace_canonicalize:
        description: Record actual pinned CLI Win32 return values with the existing cloud SDK debugger
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host-windows-real-axes:
    name: Native host Windows real process axes
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Bind native-host build to controlled Node runtime
        shell: pwsh
        run: |
          $node = Get-Command node.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { throw 'Controlled Node runtime unavailable' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOGOKE_CONTROLLED_NODE_PATH=$node"
      - name: Bind F tests to the installed Git backend image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = Get-Command git.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $execPath = & $entry --exec-path
          if ($LASTEXITCODE -ne 0 -or @($execPath).Count -ne 1) { throw 'Git backend discovery failed' }
          $mingw = Split-Path -Parent (Split-Path -Parent $execPath.Trim())
          $backend = Join-Path $mingw 'bin/git.exe'
          if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) { throw 'Actual Git backend image unavailable; no launcher substitute' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOGOKE_CONTROLLED_GIT_PATH=$backend"
          Write-Output "Git backend SHA256=$((Get-FileHash -LiteralPath $backend -Algorithm SHA256).Hash)"
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Pin Codex CLI for native instance registration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:APPDATA 'npm'
          & npm install --global --prefix $prefix --ignore-scripts '@openai/codex@0.149.0'
          if ($LASTEXITCODE -ne 0) { throw "Codex CLI install failed: $LASTEXITCODE" }
          $binary = Join-Path $prefix 'node_modules\@openai\codex\node_modules\@openai\codex-win32-x64\vendor\x86_64-pc-windows-msvc\bin\codex.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Pinned Codex CLI image missing' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'codex-cli 0.149.0') { throw "Pinned Codex CLI version mismatch: $version" }
      - name: Build native-host release image and check test-hook exclusion
        id: release-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $log = Join-Path $evidenceRoot 'release-build.log'
          $output = & cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log | Write-Host
          $finishedRelease = [regex]::IsMatch(($output -join "`n"), 'Finished.*release.*profile')
          $state = if ($null -eq $exitCode -or ($exitCode -eq 0 -and -not $finishedRelease)) {
            'FAIL_INSTRUMENT'
          } elseif ($exitCode -ne 0) {
            'FAIL'
          } else {
            'PASS'
          }
          [ordered]@{
            command = 'cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml'
            executed = $true
            exit_code = $exitCode
            finished_release_profile = $finishedRelease
            state = $state
            log = 'release-build.log'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidenceRoot 'release-build-result.json') -Encoding utf8NoBOM
          if ($state -ne 'PASS') { throw "Native-host release build failed or lacked a release-profile completion marker: $state (exit $exitCode)" }
      - name: Build and run required native-host process axes
        id: native-axes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'apps/desktop/native-host/Cargo.toml'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $releaseResultPath = Join-Path $evidenceRoot 'release-build-result.json'
          $releaseResult = if (Test-Path -LiteralPath $releaseResultPath -PathType Leaf) {
            Get-Content -LiteralPath $releaseResultPath -Raw | ConvertFrom-Json
          } else {
            [ordered]@{
              command = 'cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml'
              executed = $false
              exit_code = $null
              finished_release_profile = $false
              state = 'FAIL_INSTRUMENT'
              reason = 'RELEASE_BUILD_RESULT_MISSING'
              log = 'release-build.log'
            }
          }
          $axes = @(
            @{ id = 'b07_two_process'; target = 'apps/desktop/native-host/tests/b07_two_process.rs' },
            @{ id = 'host_typed_ops'; target = 'apps/desktop/native-host/tests/host_typed_ops.rs' }
          )
          $results = @()
          $failed = $false
          foreach ($axis in $axes) {
            $log = Join-Path $evidenceRoot "$($axis.id).log"
            if (-not (Test-Path -LiteralPath $axis.target -PathType Leaf)) {
              $results += [ordered]@{
                axis = $axis.id
                target = $axis.target
                state = 'FAIL_INSTRUMENT'
                exit_code = $null
                discovered = 0
                executed = 0
                passed = 0
                failed = 0
                skipped = 0
                reason = 'TARGET_MISSING'
                log = $log
              }
              $failed = $true
              continue
            }
            $output = & cargo test --locked --manifest-path $manifest --test $axis.id -- --nocapture 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath $log | Write-Host
            $text = $output -join "`n"
            $running = [regex]::Matches($text, '(?m)^running (\d+) tests?$')
            $summaries = [regex]::Matches($text, 'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out')
            $discovered = if ($running.Count -eq 0) { 0 } else { ($running | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum }
            $passed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[2].Value } | Measure-Object -Sum).Sum }
            $testFailed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[3].Value } | Measure-Object -Sum).Sum }
            $skipped = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[4].Value } | Measure-Object -Sum).Sum }
            $measured = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[5].Value } | Measure-Object -Sum).Sum }
            $filtered = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[6].Value } | Measure-Object -Sum).Sum }
            $executed = $passed + $testFailed
            $accounted = $executed + $skipped + $measured + $filtered
            $instrumentOk = $summaries.Count -gt 0 -and $discovered -gt 0 -and $executed -gt 0 -and $accounted -eq $discovered
            $state = if (-not $instrumentOk) { 'FAIL_INSTRUMENT' } elseif ($exitCode -ne 0 -or $testFailed -ne 0 -or $skipped -gt 0) { 'FAIL' } else { 'PASS' }
            $reason = if (-not $instrumentOk) { 'ZERO_TESTS_OR_INCONSISTENT_MACHINE_COUNTS' } elseif ($exitCode -ne 0 -or $testFailed -ne 0) { 'TEST_FAILURE' } elseif ($skipped -gt 0) { 'IGNORED_TESTS' } else { $null }
            $results += [ordered]@{
              axis = $axis.id
              target = $axis.target
              state = $state
              exit_code = $exitCode
              discovered = $discovered
              executed = $executed
              passed = $passed
              failed = $testFailed
              skipped = $skipped
              reason = $reason
              log = $log
            }
            if ($state -ne 'PASS') { $failed = $true }
          }
          $machineResult = Join-Path $evidenceRoot 'machine-result.json'
          [ordered]@{
            schema = 'gogoke.native-host-ci-evidence.v1'
            commit_sha = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            runner_os = '${{ runner.os }}'
            runner_image = $env:ImageOS
            evidence_scope = 'WINDOWS_SERVER_REAL_RUN_NOT_WINDOWS_11_DESKTOP'
            release_build = $releaseResult
            axes = $results
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $machineResult -Encoding utf8NoBOM
          "machine_result=$machineResult" >> $env:GITHUB_OUTPUT
          if ($failed -or $releaseResult.state -ne 'PASS') { throw 'Release build or one or more required native-host axes failed or did not execute.' }
      - name: Run focused native-host lib failure probes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $probes = @(
            @{ id = 'ipc-dacl'; filter = 'applies_current_user_only_dacl_and_first_instance_guard' },
            @{ id = 'prepare-activate'; filter = 'native_host_prepare_and_activate_are_separate_fail_closed_phases' },
            @{ id = 'job-descendant'; filter = 'real_windows_job_keeps_descendant_after_parent_exit_and_then_stops_tree' },
            @{ id = 'protocol-stdio'; filter = 'suspended_job_child_receives_only_explicit_protocol_handles' },
            @{ id = 'protocol-input-close'; filter = 'native_input_close_delivers_eof_and_preserves_graceful_stop_proof' },
            @{ id = 'bound-instance-acl'; filter = 'bound_nonempty_tree_grants_only_its_recorded_instance_identity' },
            @{ id = 'pinned-codex-account-read'; filter = 'pinned_codex_empty_home_reports_native_logout_and_durable_stop' },
            @{ id = 'pinned-codex-credential-files'; filter = 'pinned_codex_isolated_credential_file_lifecycle_uses_cli_without_host_reads' },
            @{ id = 'persisted-permission-intent'; filter = 'permission_intent_is_persisted_validated_and_never_defaulted' },
            @{ id = 'native-worktree-core'; filter = 'store::worktree::tests::' },
            @{ id = 'persistent-partial-eof'; filter = 'persistent_reader_distinguishes_unterminated_output_from_empty_eof' },
            @{ id = 'process-coordination'; filter = 'prepared_process_identity_is_durable_before_activation' },
            @{ id = 'protocol-deadline'; filter = 'protocol_write_deadline_stops_non_reader_job' },
            @{ id = 'job-at-create'; filter = 'both_stdio_modes_are_in_the_exact_job_at_creation_and_allow_explicit_assign' },
            @{ id = 'job-assign-cleanup'; filter = 'failed_launch_cleanup_retains_exact_handles_on_timeout_or_failed_wait' },
            @{ id = 'job-already-exited'; filter = 'already_signaled_child_is_confirmed_even_if_terminate_reports_failure' },
            @{ id = 'record-before-activate'; filter = 'failed_production_prepared_record_does_not_activate_child' },
            @{ id = 'root-poison-after-precheck'; filter = 'poison_published_after_precheck_blocks_same_physical_root_before_lock_publication' }
          )
          if ('${{ inputs.trace_canonicalize }}' -eq 'true') {
            $debugger = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
            if (-not (Test-Path -LiteralPath $debugger -PathType Leaf)) {
              throw 'Existing SDK debugger unavailable; directed measurement did not run.'
            }
            $env:GOGOKE_CI_CDB = $debugger
            $env:GOGOKE_CI_CDB_LOGROOT = $evidenceRoot
            $probes = @($probes | Where-Object { $_.id -in @('pinned-codex-account-read', 'pinned-codex-credential-files', 'persisted-permission-intent') })
            Write-Host "Directed trace only: debugger SHA256=$((Get-FileHash -LiteralPath $debugger -Algorithm SHA256).Hash); full library suite NOT_RUN."
          }
          $results = @()
          foreach ($probe in $probes) {
            $log = Join-Path $evidenceRoot "focused-$($probe.id).log"
            $output = & cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml --lib $probe.filter -- --nocapture 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath $log | Write-Host
            $text = $output -join "`n"
            $running = [regex]::Matches($text, '(?m)^running (\d+) tests?$')
            $summaries = [regex]::Matches($text, 'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out')
            $discovered = if ($running.Count -eq 0) { 0 } else { ($running | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum }
            $passed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[2].Value } | Measure-Object -Sum).Sum }
            $failed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[3].Value } | Measure-Object -Sum).Sum }
            $skipped = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[4].Value } | Measure-Object -Sum).Sum }
            $state = if ($discovered -ne 1 -or $passed + $failed -ne 1 -or $summaries.Count -eq 0) {
              'FAIL_INSTRUMENT'
            } elseif ($exitCode -ne 0 -or $failed -ne 0 -or $skipped -ne 0) {
              'FAIL'
            } else {
              'PASS'
            }
            $results += [ordered]@{
              id = $probe.id
              filter = $probe.filter
              exit_code = $exitCode
              discovered = $discovered
              executed = $passed + $failed
              passed = $passed
              failed = $failed
              skipped = $skipped
              state = $state
              log = "focused-$($probe.id).log"
            }
          }
          $results | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidenceRoot 'focused-lib-probes.json') -Encoding utf8NoBOM
          if (@($results | Where-Object state -ne 'PASS').Count -ne 0) { throw 'One or more focused native-host lib probes failed.' }
      - name: Run all native-host library unit tests
        if: ${{ !cancelled() && !inputs.trace_canonicalize }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $log = Join-Path $evidenceRoot 'lib-tests.log'
          $output = & cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml --lib -- --nocapture 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log | Write-Host
          $text = $output -join "`n"
          $running = [regex]::Matches($text, '(?m)^running (\d+) tests?$')
          $summaries = [regex]::Matches($text, 'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out')
          $discovered = if ($running.Count -eq 0) { 0 } else { ($running | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum }
          $passed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[2].Value } | Measure-Object -Sum).Sum }
          $testFailed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[3].Value } | Measure-Object -Sum).Sum }
          $skipped = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[4].Value } | Measure-Object -Sum).Sum }
          $executed = $passed + $testFailed
          $state = if ($summaries.Count -eq 0 -or $discovered -eq 0 -or $executed -eq 0) {
            'FAIL_INSTRUMENT'
          } elseif ($exitCode -ne 0 -or $testFailed -ne 0 -or $skipped -ne 0) {
            'FAIL'
          } else {
            'PASS'
          }
          $machineResult = Join-Path $evidenceRoot 'machine-result.json'
          $machine = if (Test-Path -LiteralPath $machineResult -PathType Leaf) {
            Get-Content -LiteralPath $machineResult -Raw | ConvertFrom-Json -AsHashtable
          } else {
            [ordered]@{
              schema = 'gogoke.native-host-ci-evidence.v1'
              commit_sha = '${{ github.sha }}'
              run_id = '${{ github.run_id }}'
              run_attempt = '${{ github.run_attempt }}'
              runner_os = '${{ runner.os }}'
              runner_image = $env:ImageOS
              evidence_scope = 'WINDOWS_SERVER_REAL_RUN_NOT_WINDOWS_11_DESKTOP'
              axes = @()
            }
          }
          $machine['lib_tests'] = [ordered]@{
            command = 'cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml --lib -- --nocapture'
            exit_code = $exitCode
            discovered = $discovered
            executed = $executed
            passed = $passed
            failed = $testFailed
            skipped = $skipped
            state = $state
            log = 'lib-tests.log'
          }
          $focusedPath = Join-Path $evidenceRoot 'focused-lib-probes.json'
          $machine['focused_lib_probes'] = if (Test-Path -LiteralPath $focusedPath -PathType Leaf) {
            @(Get-Content -LiteralPath $focusedPath -Raw | ConvertFrom-Json)
          } else {
            @()
          }
          $machine | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $machineResult -Encoding utf8NoBOM
          if ($state -ne 'PASS') { throw "Native-host library unit tests failed or did not execute: $state (exit $exitCode)" }
      - name: Test production LPAC path shim behavior in cloud
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $output = & cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml -p gogoke-lpac-path-compat --lib -- --nocapture 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath (Join-Path $evidenceRoot 'lpac-path-shim.log') | Write-Host
          $text = $output -join "`n"
          $summary = [regex]::Match($text, 'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out')
          $valid = $summary.Success -and [int]$summary.Groups[2].Value -eq 2 -and [int]$summary.Groups[3].Value -eq 0 -and [int]$summary.Groups[4].Value -eq 0 -and [int]$summary.Groups[6].Value -eq 0
          $state = if ($exitCode -eq 0 -and $valid) { 'PASS' } else { 'FAIL' }
          [ordered]@{ axis = 'lpac_path_same_source_shim'; state = $state; exit_code = $exitCode; passed = if ($summary.Success) { [int]$summary.Groups[2].Value } else { 0 }; failed = if ($summary.Success) { [int]$summary.Groups[3].Value } else { 0 }; skipped = if ($summary.Success) { [int]$summary.Groups[4].Value } else { 0 } } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceRoot 'lpac-path-shim-result.json') -Encoding utf8NoBOM
          if ($state -ne 'PASS') { throw "Production LPAC shim tests failed or did not execute: $exitCode" }
      - name: Upload native-host machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gogoke-native-host-evidence
          if-no-files-found: error
          retention-days: 30

  gogoke-server-tests:
    name: Gogoke server cloud tests
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
      - name: Bind native-host fixture build to controlled Node runtime
        shell: pwsh
        run: |
          $node = Get-Command node.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { throw 'Controlled Node runtime unavailable' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOGOKE_CONTROLLED_NODE_PATH=$node"
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Install locked server dependencies without lifecycle scripts
        working-directory: third_party/t3code
        shell: pwsh
        run: pnpm install --filter 't3...' --frozen-lockfile --ignore-scripts --store-dir (Join-Path $env:RUNNER_TEMP 'pnpm-store')
      - name: Build exact native-host test fixture in cloud
        run: cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml
      - name: Verify machine-result parsers with failing controls
        run: node --test tools/ci/gogoke-server-tests.test.mjs
      - name: Verify controlled Pi protocol fixture process
        run: node --test apps/desktop/test-fixtures/s1-r4/ledger/controlled-pi.test.mjs
      - name: Run all Gogoke server test files and write machine result
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:GOGOKE_SERVER_EVIDENCE_ROOT = Join-Path $env:RUNNER_TEMP 'gogoke-server-evidence'
          $env:GOGOKE_NATIVE_HOST = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/native-host/target/release/gogoke-native-host.exe'
          node tools/ci/gogoke-server-tests.mjs
      - name: Upload Gogoke server machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogoke-server-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gogoke-server-evidence
          if-no-files-found: error
          retention-days: 30
