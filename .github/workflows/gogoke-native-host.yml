name: gogoke native-host CI

on:
  workflow_dispatch:
    inputs:
      focused_library:
        description: Affected checks only (seat-scope, ledger-scope, native-takeover, pipe-evidence or grok-permission); all full and formal gates are NOT_RUN
        type: string
        default: ""
      secretary_routine_fixture_only:
        description: Build and test original USER secretary routine boundaries with production mutation; full library and other formal gates are NOT_RUN
        type: boolean
        default: false
      dependency_lock_only:
        description: Generate the pinned native dependency lock as data only; build, library, mutation and server gates are NOT_RUN
        type: boolean
        default: false
      security_remainder_source:
        description: Run only unfinished security groups against this exact ancestor source SHA; other gates are NOT_RUN
        type: string
        default: ""
      trace_canonicalize:
        description: Record actual pinned CLI Win32 return values with the existing cloud SDK debugger
        type: boolean
        default: false
      job_descendant_fixture_only:
        description: Verify real Job descendant and protocol-write deadline fixtures; full library and mutation gates are NOT_RUN
        type: boolean
        default: false
      stop_124_fixture_only:
        description: Verify the changed natural-exit fixture only; full library and mutation gates are NOT_RUN
        type: boolean
        default: false
      ordinary_oauth_fixture_only:
        description: Verify ordinary OAuth callback and stderr repairs only; full library, mutation and server gates are NOT_RUN
        type: boolean
        default: false
      code_mode_fixture_only:
        description: Verify fixed Code Mode file permission binding and its production grant mutation only; full library, other mutations and server gates are NOT_RUN
        type: boolean
        default: false
      private_history_fixture_only:
        description: Build and verify F history and credential metadata boundaries only; full library, mutations and server gates are NOT_RUN
        type: boolean
        default: false
      grok_home_fixture_only:
        description: Select thirteen Grok HOME boundaries and initial-auth mutation within private_history_fixture_only; other F, full library and server gates are NOT_RUN
        type: boolean
        default: false
      full_library_only:
        description: Run the unchanged formal native library and LPAC shim commands; separate process, focused, mutation and server suites are NOT_RUN
        type: boolean
        default: false
      catalog_program_fixture_only:
        description: Verify real catalog hardlinks and three compiled isolation mutations only; other native, library, mutation and server gates are NOT_RUN
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-focused-library:
    if: ${{ inputs.focused_library }}
    name: Affected native library checks only
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
      FOCUSED_LIBRARY: ${{ inputs.focused_library }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Run the explicitly selected affected tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filters = switch ($env:FOCUSED_LIBRARY) {
            'seat-scope' { @('store::seat::orchestration::tests',
              'store::seat::tests::native_child_scope_cap_refuses_a_second_seat_without_minting_a_grant',
              'store::seat::tests::native_child_create_derives_only_first_exact_dispatch_grant',
              'store::product_database::v37_seat::tests::owner_orchestration_bounds_have_a_separate_receipt_and_preserve_project_cap') }
            'ledger-scope' { @('work_source_cannot_mint_a_secretary_global_reader',
              'native_user_ledger_scopes_replay_and_subscription_survive_reopen') }
            'native-takeover' { @('native_takeover_') }
            'grok-permission' { @('grok_permission') }
            'pipe-evidence' { @('stop_requires_clean_original_eof_not_a_generic_source_error',
              'persistent_reader_keeps_eof_unknown_after_exact_child_exit') }
            default { throw 'Unknown affected-check selection; no arbitrary shell or test filter is accepted.' }
          }
          $node = Get-Command node.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $env:GOGOKE_CONTROLLED_NODE_PATH = $node
          $evidence = Join-Path $env:RUNNER_TEMP "native-affected-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $results = @()
          $failures = @()
          foreach ($filter in $filters) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $output = & cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml --lib $filter -- --nocapture --show-output 2>&1
            $code = $LASTEXITCODE
            $timer.Stop()
            $output | Set-Content (Join-Path $evidence ($filter.Replace(':','_') + '.log')) -Encoding utf8NoBOM
            $output | Write-Host
            $summary = @($output | Select-String -Pattern '^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out')
            if ($code -ne 0 -or $summary.Count -ne 1 -or [int]$summary[0].Matches[0].Groups[1].Value -lt 1) {
              $results += [ordered]@{ filter=$filter; state='FAILED'; exitCode=$code; seconds=$timer.Elapsed.TotalSeconds }
              $failures += $filter
              if ($output -match 'could not compile') { break }
              continue
            }
            $results += [ordered]@{ filter=$filter; passed=[int]$summary[0].Matches[0].Groups[1].Value; seconds=$timer.Elapsed.TotalSeconds }
          }
          [ordered]@{ sourceCommit=$env:GITHUB_SHA; state='AFFECTED_CHECKS_ONLY'; results=$results; fullLibrary='NOT_RUN'; formalGates='NOT_RUN' } |
            ConvertTo-Json -Depth 6 | Set-Content (Join-Path $evidence 'result.json') -Encoding utf8NoBOM
          if ($env:FOCUSED_LIBRARY -eq 'pipe-evidence') {
            $output = & cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml -p gogoke-lpac-path-compat --lib -- --nocapture 2>&1
            $code = $LASTEXITCODE
            $output | Set-Content (Join-Path $evidence 'lpac-path-shim.log') -Encoding utf8NoBOM
            $output | Write-Host
            $summary = @($output | Select-String -Pattern '^test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out')
            $shimPassed = $code -eq 0 -and $summary.Count -eq 1
            [ordered]@{ sourceCommit=$env:GITHUB_SHA; scope='PIPE_EVIDENCE_SAME_SOURCE_SHIM'; state=$(if ($shimPassed) { 'PASS' } else { 'FAIL' }); passed=$(if ($shimPassed) { 2 } else { 0 }); exitCode=$code; fullLibrary='NOT_RUN'; formalGates='NOT_RUN' } |
              ConvertTo-Json | Set-Content (Join-Path $evidence 'lpac-path-shim-result.json') -Encoding utf8NoBOM
            if (-not $shimPassed) { $failures += 'lpac-path-shim' }
          }
          'Affected checks only; full library, full LPAC, process, mutation and server gates: NOT_RUN. The pipe-evidence selection also runs the two focused same-source shim tests.' >> $env:GITHUB_STEP_SUMMARY
          if ($failures.Count -gt 0) { throw "Affected checks failed or had no completed tests: $($failures -join ', ')" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-affected-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-affected-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  native-dependency-lock:
    if: ${{ inputs.dependency_lock_only && !inputs.focused_library }}
    name: Resolve pinned native dependency lock only
    timeout-minutes: 10
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Generate lock data without native compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep every existing locked registry package; resolve only the
          # workspace's new exact dependencies and their missing transitive set.
          cargo update --workspace --manifest-path apps/desktop/native-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency resolution failed: $LASTEXITCODE" }
          $source = (git rev-parse HEAD).Trim()
          $lock = 'apps/desktop/native-host/Cargo.lock'
          $manifest = 'apps/desktop/native-host/Cargo.toml'
          [ordered]@{ schema='gogoke.native-dependency-lock.v1'; sourceCommit=$source;
            manifestSha256=(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant();
            lockSha256=(Get-FileHash -LiteralPath $lock -Algorithm SHA256).Hash.ToLowerInvariant();
            compilerExecuted=$false; formalGates='NOT_RUN' } |
            ConvertTo-Json | Set-Content -LiteralPath native-dependency-lock-result.json -Encoding utf8NoBOM
          'Native compilation, tests, mutations and product gates: NOT_RUN' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: native-dependency-lock-${{ github.sha }}-${{ github.run_id }}
          path: |
            apps/desktop/native-host/Cargo.lock
            native-dependency-lock-result.json
          if-no-files-found: error
          retention-days: 14

  native-secretary-routine-boundaries:
    if: ${{ inputs.secretary_routine_fixture_only && !inputs.dependency_lock_only && !inputs.focused_library }}
    name: Native Secretary original USER routine boundaries
    # Original routine run used 19m47s; history-source mutation adds two
    # measured 4-5 minute test rebuilds without changing production budgets.
    timeout-minutes: 35
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Build and verify Secretary source and transaction boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (@('${{ inputs.full_library_only }}','${{ inputs.private_history_fixture_only }}','${{ inputs.code_mode_fixture_only }}','${{ inputs.catalog_program_fixture_only }}') -contains 'true' -or '${{ inputs.security_remainder_source }}' -ne '') { throw 'Secretary scope cannot be combined with a different evidence scope' }
          $env:GOGOKE_CONTROLLED_NODE_PATH = (Get-Command node.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source)
          $evidence = Join-Path $env:RUNNER_TEMP 'gogoke-secretary-routine-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'release-build.log') | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Secretary release build failed: $LASTEXITCODE" }
          $results = @()
          $failures = @()
          foreach ($filter in @('v37_secretary_routine_model_tests','secretary_schedule::tests','secretary_routines_replay_absence_and_unknown_are_fail_closed','secretary_thread_registers_only_global_read_and_user_routine_and_rejects_tool_substitution','only_exact_live_user_input_adds_an_atomic_fixed_presence_witness','secretary_configuration_ingress_preserves_unset_and_exact_owner_bytes','secretary_routine_user_commands_read_original_rows_and_preserve_history','secretary_original_user_pages_preserve_historical_provenance_and_gaps')) {
            $output = & cargo test --locked --manifest-path apps/desktop/native-host/Cargo.toml --lib $filter -- --nocapture --show-output 2>&1
            $exitCode = $LASTEXITCODE
            $label = $filter.Replace('::','-')
            $output | Tee-Object -FilePath (Join-Path $evidence "$label.log") | Write-Host
            $joined = $output -join "`n"
            $summary = [regex]::Matches($joined,'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;')
            $valid = $summary.Count -eq 1 -and $exitCode -eq 0 -and [int]$summary[0].Groups[2].Value -gt 0 -and [int]$summary[0].Groups[3].Value -eq 0 -and [int]$summary[0].Groups[4].Value -eq 0
            $results += [ordered]@{ filter=$filter; exitCode=$exitCode; state=$(if($valid){'PASS'}else{'FAIL_OR_NOT_EXECUTED'}); passed=$(if($summary.Count -eq 1){[int]$summary[0].Groups[2].Value}else{$null}); failed=$(if($summary.Count -eq 1){[int]$summary[0].Groups[3].Value}else{$null}); ignored=$(if($summary.Count -eq 1){[int]$summary[0].Groups[4].Value}else{$null}) }
            if (-not $valid) { $failures += $filter }
            # Independent compiled cases continue after a behavioral failure.
            # A missing summary cannot prove execution; stop repeating a broken
            # test build and retain all later filters as NOT_RUN.
            if ($exitCode -ne 0 -and $summary.Count -eq 0) { break }
          }
          [ordered]@{ schema='gogoke.secretary-routine-boundaries.v1'; sourceCommit=(git rev-parse HEAD).Trim(); state=$(if($failures.Count -eq 0){'PASS_DIRECTED_BOUNDARIES_ONLY'}else{'FAIL_DIRECTED_BOUNDARIES'}); library='NOT_RUN'; product='NOT_RUN'; results=$results } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence 'boundary-results.json') -Encoding utf8NoBOM
          if ($failures.Count -ne 0) { throw "Secretary directed boundary failed or did not execute: $($failures -join ', ')" }
          & ./tools/ci/gogoke37-secretary-routine-mutation.ps1 -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { throw "Secretary production mutation failed: $LASTEXITCODE" }
          & ./tools/ci/gogoke37-secretary-routine-mutation.ps1 -EvidenceDirectory $evidence -History
          if ($LASTEXITCODE -ne 0) { throw "Secretary history production mutation failed: $LASTEXITCODE" }
          'Only actual directed boundary cases and compile-valid production mutation ran. Full library, other native/security/server gates and Win11 product: NOT_RUN.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secretary-routine-boundaries-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogoke-secretary-routine-evidence/*
          if-no-files-found: error
          retention-days: 30

  native-host-windows-real-axes:
    if: ${{ !inputs.secretary_routine_fixture_only && !inputs.dependency_lock_only && !inputs.catalog_program_fixture_only && !inputs.security_remainder_source && !inputs.focused_library }}
    name: ${{ matrix.shard == 'all' && 'Native host Windows real process axes' || format('Native host Windows library {0}', matrix.shard) }}
    # Full-library shards use independent runners so their fixed native fixtures
    # never execute in separate test processes on the same Windows host.
    # Compile-heavy security mutations run independently below: the combined
    # exact-source run exhausted 105 minutes after the library had passed.
    timeout-minutes: 105
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.full_library_only && '["runtime","login","session","remainder"]' || '["all"]') }}
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Bind native-host build to controlled Node runtime
        shell: pwsh
        run: |
          $node = Get-Command node.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { throw 'Controlled Node runtime unavailable' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOGOKE_CONTROLLED_NODE_PATH=$node"
      - name: Bind F tests to the installed Git backend image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = Get-Command git.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $execPath = & $entry --exec-path
          if ($LASTEXITCODE -ne 0 -or @($execPath).Count -ne 1) { throw 'Git backend discovery failed' }
          $mingw = Split-Path -Parent (Split-Path -Parent $execPath.Trim())
          $backend = Join-Path $mingw 'bin/git.exe'
          if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) { throw 'Actual Git backend image unavailable; no launcher substitute' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOGOKE_CONTROLLED_GIT_PATH=$backend"
          Write-Output "Git backend SHA256=$((Get-FileHash -LiteralPath $backend -Algorithm SHA256).Hash)"
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Pin Codex CLI for native instance registration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:APPDATA 'npm'
          & npm install --global --prefix $prefix --ignore-scripts '@openai/codex@0.160.0'
          if ($LASTEXITCODE -ne 0) { throw "Codex CLI install failed: $LASTEXITCODE" }
          $binary = Join-Path $prefix 'node_modules\@openai\codex\node_modules\@openai\codex-win32-x64\vendor\x86_64-pc-windows-msvc\bin\codex.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Pinned Codex CLI image missing' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'codex-cli 0.160.0') { throw "Pinned Codex CLI version mismatch: $version" }
      - name: Pin fixed Claude CLI for native provider output controls
        id: fixed-claude
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:APPDATA 'npm'
          & npm install --global --prefix $prefix --ignore-scripts '@anthropic-ai/claude-code@2.1.196'
          if ($LASTEXITCODE -ne 0) { throw "Claude CLI install failed: $LASTEXITCODE" }
          $package = Join-Path $prefix 'node_modules\@anthropic-ai\claude-code'
          $platform = Join-Path $package 'node_modules\@anthropic-ai\claude-code-win32-x64'
          foreach ($fact in @(@{ path=$package; name='@anthropic-ai/claude-code' }, @{ path=$platform; name='@anthropic-ai/claude-code-win32-x64' })) {
            $metadata = Get-Content -LiteralPath (Join-Path $fact.path 'package.json') -Raw | ConvertFrom-Json
            if ($metadata.name -ne $fact.name -or $metadata.version -ne '2.1.196') { throw 'Fixed Claude package identity mismatch' }
          }
          $original = Join-Path $platform 'claude.exe'
          if (-not (Test-Path -LiteralPath $original -PathType Leaf)) { throw 'Fixed Claude platform image missing' }
          # The product catalog uses the installed package's bin image. Keep
          # the official bytes identical without running npm postinstall code.
          $bin = Join-Path $package 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $binary = Join-Path $bin 'claude.exe'
          $digest = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash
          if ($digest -cne '180D7B279455E8B89D4353A5146447BE2F80B80FB0DB14BDC6DD9CB98C0AEF09') { throw "Official fixed Claude platform digest differs: $digest" }
          if (Test-Path -LiteralPath $binary) {
            $existing = Get-Item -LiteralPath $binary -Force
            Write-Output "Existing cloud catalog leaf: directory=$($existing.PSIsContainer) attributes=$($existing.Attributes) linkType=$($existing.LinkType)"
            if ($existing.PSIsContainer) { throw 'Cloud catalog leaf unexpectedly became a directory' }
            Write-Output "Existing cloud catalog leaf SHA256=$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash)"
            # This is the cloud fixture's package leaf, not an Owner installation.
            # Remove only that name; a file symlink's target is never removed.
            Remove-Item -LiteralPath $binary -ErrorAction Stop
          }
          New-Item -ItemType HardLink -Path $binary -Target $original -ErrorAction Stop | Out-Null
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $digest) { throw 'Fixed Claude bytes changed during layout preparation' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '2.1.196 (Claude Code)') { throw "Fixed Claude CLI version mismatch: $version" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOGOKE_CLAUDE_CLI_PATH=$binary"
          Write-Output "Fixed Claude CLI SHA256=$digest"
      - name: Build native-host release image and check test-hook exclusion
        id: release-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.full_library_only }}' -eq 'true') {
            if (@('${{ inputs.trace_canonicalize }}','${{ inputs.job_descendant_fixture_only }}','${{ inputs.stop_124_fixture_only }}','${{ inputs.ordinary_oauth_fixture_only }}','${{ inputs.code_mode_fixture_only }}','${{ inputs.private_history_fixture_only }}') -contains 'true') {
              throw 'Full library scope cannot be combined with a directed fixture scope'
            }
            Write-Host 'Formal native library and LPAC shim only; separate process, focused, mutation and server suites NOT_RUN.'
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $log = Join-Path $evidenceRoot 'release-build.log'
          $output = & cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log | Write-Host
          $finishedRelease = [regex]::IsMatch(($output -join "`n"), 'Finished.*release.*profile')
          $state = if ($null -eq $exitCode -or ($exitCode -eq 0 -and -not $finishedRelease)) {
            'FAIL_INSTRUMENT'
          } elseif ($exitCode -ne 0) {
            'FAIL'
          } else {
            'PASS'
          }
          [ordered]@{
            command = 'cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml'
            executed = $true
            exit_code = $exitCode
            finished_release_profile = $finishedRelease
            state = $state
            log = 'release-build.log'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidenceRoot 'release-build-result.json') -Encoding utf8NoBOM
          if ($state -ne 'PASS') { throw "Native-host release build failed or lacked a release-profile completion marker: $state (exit $exitCode)" }
      - name: Build and run required native-host process axes
        id: native-axes
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' && !inputs.full_library_only && !inputs.catalog_program_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.code_mode_fixture_only }}' -eq 'true' -and
              @('${{ inputs.trace_canonicalize }}','${{ inputs.job_descendant_fixture_only }}','${{ inputs.stop_124_fixture_only }}','${{ inputs.ordinary_oauth_fixture_only }}') -contains 'true') {
            throw 'Code Mode fixture scope cannot be combined with another directed scope'
          }
          if ('${{ inputs.private_history_fixture_only }}' -eq 'true' -and
              @('${{ inputs.trace_canonicalize }}','${{ inputs.job_descendant_fixture_only }}','${{ inputs.stop_124_fixture_only }}','${{ inputs.ordinary_oauth_fixture_only }}','${{ inputs.code_mode_fixture_only }}') -contains 'true') {
            throw 'Private-history boundary scope cannot be combined with another directed scope'
          }
          $manifest = 'apps/desktop/native-host/Cargo.toml'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'gogoke-native-host-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $releaseResultPath = Join-Path $evidenceRoot 'release-build-result.json'
          $releaseResult = if (Test-Path -LiteralPath $releaseResultPath -PathType Leaf) {
            Get-Content -LiteralPath $releaseResultPath -Raw | ConvertFrom-Json
          } else {
            [ordered]@{
              command = 'cargo build --release --locked --manifest-path apps/desktop/native-host/Cargo.toml'
              executed = $false
              exit_code = $null
              finished_release_profile = $false
              state = 'FAIL_INSTRUMENT'
              reason = 'RELEASE_BUILD_RESULT_MISSING'
              log = 'release-build.log'
            }
          }
          $axes = @(
            @{ id = 'b07_two_process'; target = 'apps/desktop/native-host/tests/b07_two_process.rs' },
            @{ id = 'host_typed_ops'; target = 'apps/desktop/native-host/tests/host_typed_ops.rs' }
          )
          $results = @()
          $failed = $false
          foreach ($axis in $axes) {
            $log = Join-Path $evidenceRoot "$($axis.id).log"
            if (-not (Test-Path -LiteralPath $axis.target -PathType Leaf)) {
              $results += [ordered]@{
                axis = $axis.id
                target = $axis.target
                state = 'FAIL_INSTRUMENT'
                exit_code = $null
                discovered = 0
                executed = 0
                passed = 0
                failed = 0
                skipped = 0
                reason = 'TARGET_MISSING'
                log = $log
              }
              $failed = $true
              continue
            }
            $output = & cargo test --locked --manifest-path $manifest --test $axis.id -- --nocapture 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath $log | Write-Host
            $text = $output -join "`n"
            $running = [regex]::Matches($text, '(?m)^running (\d+) tests?$')
            $summaries = [regex]::Matches($text, 'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out')
            $discovered = if ($running.Count -eq 0) { 0 } else { ($running | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum }
            $passed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[2].Value } | Measure-Object -Sum).Sum }
            $testFailed = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[3].Value } | Measure-Object -Sum).Sum }
            $skipped = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[4].Value } | Measure-Object -Sum).Sum }
            $measured = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[5].Value } | Measure-Object -Sum).Sum }
            $filtered = if ($summaries.Count -eq 0) { 0 } else { ($summaries | ForEach-Object { [int]$_.Groups[6].Value } | Measure-Object -Sum).Sum }
            $executed = $passed + $testFailed
            $accounted = $executed + $skipped + $measured + $filtered
            $instrumentOk = $summaries.Count -gt 0 -and $discovered -gt 0 -and $executed -gt 0 -and $accounted -eq $discovered
            $state = if (-not $instrumentOk) { 'FAIL_INSTRUMENT' } elseif ($exitCode -ne 0 -or $testFailed -ne 0 -or $skipped -gt 0) { 'FAIL' } else { 'PASS' }
            $reason = if (-not $instrumentOk) { 'ZERO_TESTS_OR_INCONSISTENT_MACHINE_COUNTS' } elseif ($exitCode -ne 0 -or $testFailed -ne 0) { 'TEST_FAILURE' } elseif ($skipped -gt 0) { 'IGNORED_TESTS' } else { $null }
            $results += [ordered]@{
              axis = $axis.id
              target = $axis.target
              state = $state
              exit_code = $exitCode
              discovered = $discovered
              executed = $executed
              passed = $passed
              failed = $testFailed
              skipped = $skipped
              reason = $reason
              log = $log
            }
            if ($state -ne 'PASS') { $failed = $true }
          }
          $machineResult = Join-Path $evidenceRoot 'machine-result.json'
          [ordered]@{
            schema = 'gogoke.native-host-ci-evidence.v1'
            commit_sha = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            runner_os = '${{ runner.os }}'
            runner_image = $env:ImageOS
            evidence_scope = if ('${{ inputs.grok_home_fixture_only }}' -eq 'true') { 'FOCUSED_GROK_HOME_ONLY_NOT_FULL_LIBRARY_GATE' } elseif ('${{ inputs.private_history_fixture_only }}' -eq 'true') { 'FOCUSED_F_PRIVATE_HISTORY_ONLY_NOT_FULL_LIBRARY_GATE' } elseif ('${{ inputs.code_mode_fixture_only }}' -eq 'true') { 'FOCUSED_CODE_MODE_MEMBER_ONLY_NOT_FULL_LIBRARY_GATE' } elseif ('${{ inputs.job_descendant_fixture_only }}' -eq 'true') { 'FOCUSED_JOB_DESCENDANT_AND_WRITE_DEADLINE_ONLY_NOT_FULL_LIBRARY_GATE' } elseif ('${{ inputs.stop_124_fixture_only }}' -eq 'true') { 'FOCUSED_STOP_124_FIXTURE_ONLY_NOT_FULL_LIBRARY_GATE' } elseif ('${{ inputs.ordinary_oauth_fixture_only }}' -eq 'true') { 'FOCUSED_ORDINARY_OAUTH_REPAIRS_ONLY_NOT_FULL_LIBRARY_GATE' } else { 'WINDOWS_SERVER_REAL_RUN_NOT_WINDOWS_11_DESKTOP' }
            release_build = $releaseResult
            axes = $results
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $machineResult -Encoding utf8NoBOM
          "machine_result=$machineResult" >> $env:GITHUB_OUTPUT
          if ($failed -or $releaseResult.state -ne 'PASS') { throw 'Release build or one or more required native-host axes failed or did not execute.' }
      - name: Run focused native-host lib failure probes
