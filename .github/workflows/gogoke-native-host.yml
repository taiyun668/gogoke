              @{ id = 'legacy-holder-boot-query'; filter = 'native_boot_query_is_stable_within_one_boot' },
              @{ id = 'legacy-original-product'; filter = 'legacy_original_home_preserves_unknown_and_reopens_exact_holder_fence' },
