name: gogoke public source hygiene

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-hygiene:
    name: Scan committed public source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify plan manifest against committed bytes with trusted main verifier
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          prefix = 'docs/design/gogoke-37-plan-v1/'
          with tempfile.TemporaryDirectory(prefix='gogoke-plan-', dir=os.environ['RUNNER_TEMP']) as temporary:
              root = pathlib.Path(temporary)
              canonical = root / 'plan'
              canonical.mkdir()
              for name in ('PLAN.json', 'PLAN.md', 'MANIFEST.json', 'verify_plan.py'):
                  raw = subprocess.check_output(['git', 'show', 'HEAD:' + prefix + name])
                  (canonical / name).write_bytes(raw)
              trusted = root / 'trusted-main-verify-plan.py'
              trusted.write_bytes(subprocess.check_output(['git', 'show', 'origin/main:' + prefix + 'verify_plan.py']))
              subprocess.run([sys.executable, str(trusted), '--root', str(canonical), '--manifest', '--self-test'], check=True)
          PY
      - name: Positive control and scanner tests
        run: |
          python tools/check-public-source.py --self-test --control-only
          python -m unittest discover -s tools/tests -p test_check_public_source.py -v
      - name: Scan every committed file in the candidate tree
        run: python tools/check-public-source.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
      - name: Validate sealed CLI source evidence controls
        env:
          GOGOKE_E2E_TEST_TEMP_ROOT: ${{ runner.temp }}
        run: node --test tools/e2e/*managed-source.test.mjs
      - name: Parse development E2E scripts without running product flows
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import subprocess

          scripts = pathlib.Path("tools/e2e")
          for path in sorted(scripts.glob("*.mjs")):
              subprocess.run(["node", "--check", str(path)], check=True)
          for path in sorted(scripts.glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          print("Development E2E syntax parsed; product flows NOT_RUN")
          PY
