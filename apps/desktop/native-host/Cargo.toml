[package]
name = "gogoke-native-host"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gogoke-native-host"
path = "src/main.rs"

[[bin]]
name = "gogoke-root-lock-probe"
path = "src/root/lock_probe.rs"

[dependencies]
ryu-js = "=1.0.3"
# Reuse the exact SHA-256 crate already pinned for the LPAC shim build.
sha2 = "=0.10.9"
# Use the existing desktop calendar versions; native H owns clock and source.
chrono = { version = "=0.4.43", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.64"

[target.'cfg(windows)'.dependencies]
gogoke-lpac-path-compat = { path = "src/process/session/compat" }

[build-dependencies]
cc = "=1.4.2"

[workspace]

# The actual pinned CLI images are hashed by native test code. Optimize only
# this test package while retaining the test profile's debug assertions and
# overflow checks; release construction and production budgets are unchanged.
[profile.test.package.gogoke-native-host]
opt-level = 3
debug-assertions = true
overflow-checks = true

# The normal SHA backend also runs at opt3 in tests. Assertions remain enabled.
[profile.test.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true
